<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>module-soul — IXpansion</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0a0a14;color:#e0e0e0;min-height:100vh}
.header{background:linear-gradient(135deg,#1a1a2e,#16213e);padding:20px 24px;border-bottom:1px solid #222244}
.header h1{font-size:1.4em;color:#41b3a3}.header p{color:#888;margin-top:2px;font-size:0.85em}
.content{padding:20px 24px}
.card{background:#161628;border:1px solid #222244;border-radius:10px;padding:16px;margin-bottom:12px}
pre{background:#0d0d1a;padding:12px;border-radius:6px;overflow-x:auto;font-size:0.82em;color:#ccc}
</style>
</head>
<body>
<div class="header"><h1>module-soul</h1><p>API data below</p></div>
<div class="content"><div class="card"><pre id="data">Loading...</pre></div></div>
<script>
fetch('/module_soul').then(r=>r.json()).then(d=>{
  document.getElementById('data').textContent=JSON.stringify(d,null,2);
}).catch(e=>{
  fetch('/module-soul').then(r=>r.json()).then(d=>{
    document.getElementById('data').textContent=JSON.stringify(d,null,2);
  }).catch(e2=>{
    document.getElementById('data').textContent='Error: '+e2.message;
  });
});
</script>
</body>
</html>
