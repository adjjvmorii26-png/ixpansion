name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pin through ubuntu-latest → 26.04 migration (through ~2026-11-19).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest pytest-asyncio
      - name: Run full test suite
        run: python -m pytest tests/ -q --tb=short
      - name: Verify all modules parse
        run: |
          python -c "
          import ast, os, sys
          errors = []
          count = 0
          for root, dirs, files in os.walk('api'):
              dirs[:] = [d for d in dirs if d != '__pycache__']
              for f in files:
                  if f.endswith('.py'):
                      count += 1
                      try:
                          with open(os.path.join(root, f)) as fh: ast.parse(fh.read())
                      except SyntaxError as e:
                          errors.append(f'{f}: {e}')
          if errors:
              for e in errors: print(f'ERROR: {e}')
              sys.exit(1)
          print(f'All {count} API modules parse OK')
          "

  world-canvas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test deterministic World Canvas engine
        run: node --test lab/world-canvas/world-engine.test.mjs

  vercel-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install declared runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Vercel runtime contract
        run: python -m pytest tests/test_cors_contract.py tests/test_api_server_cors.py tests/test_api_server_cors_http.py -q
      - name: Import Vercel entrypoint
        run: |
          python -c "import api.index; print('api.index import: OK')"
      - name: Exercise health contract
        run: |
          python -c "from api.index import handler; r=handler({'path':'/health'}); assert isinstance(r,dict) and r.get('status') in {'ok','healthy','active'}, r; print('health contract: OK')"

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: make lint

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t ixpansion:test .
      - name: Verify container starts
        run: |
          docker run -d --name test-ixpansion -p 3000:3000 ixpansion:test
          sleep 5
          docker ps | grep test-ixpansion
          docker stop test-ixpansion
