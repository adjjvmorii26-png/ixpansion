name: CI

on:
  push:
    branches: [main, master, "lab/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # Node 24 runtimes (avoids Node 20 deprecation warnings)
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio httpx
      - name: Pytest (if present)
        run: |
          if ls tests/test_*.py >/dev/null 2>&1 || ls test_*.py >/dev/null 2>&1; then
            python -m pytest -q --tb=short
          else
            echo "No pytest files — skip"
          fi
      - name: API smoke (optional)
        run: |
          python - <<'PY'
          import importlib.util
          if importlib.util.find_spec("api") is None or importlib.util.find_spec("api.main") is None:
              print("api.main missing — skip smoke")
              raise SystemExit(0)
          from api.main import app
          from fastapi.testclient import TestClient
          client = TestClient(app)
          assert client.get("/").status_code in (200, 404, 307, 308)
          r = client.get("/health")
          assert r.status_code in (200, 404)
          print("smoke-test: ok")
          PY

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile lab + sandbox if present
        run: |
          python -m compileall -q lab sandbox scripts 2>/dev/null || true
          python -m compileall -q . -x '(^|/)(\.git|node_modules|\.venv|dist|coverage_html)/' 2>/dev/null || true
          echo "compile done"
