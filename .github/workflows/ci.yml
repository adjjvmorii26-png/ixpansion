name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest pytest-asyncio
      - name: Run full test suite
        run: python -m pytest tests/ -q --tb=short
      - name: Verify all modules parse
        run: |
          python -c "
          import ast, os, sys
          errors = []
          count = 0
          for root, dirs, files in os.walk('api'):
              dirs[:] = [d for d in dirs if d != '__pycache__']
              for f in files:
                  if f.endswith('.py'):
                      count += 1
                      try:
                          with open(os.path.join(root, f)) as fh: ast.parse(fh.read())
                      except SyntaxError as e:
                          errors.append(f'{f}: {e}')
          if errors:
              for e in errors: print(f'ERROR: {e}')
              sys.exit(1)
          print(f'All {count} API modules parse OK')
          "

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: make lint

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t ixpansion:test .
      - name: Verify container starts
        run: |
          docker run -d --name test-ixpansion -p 3000:3000 ixpansion:test
          sleep 5
          docker ps | grep test-ixpansion
          docker stop test-ixpansion
