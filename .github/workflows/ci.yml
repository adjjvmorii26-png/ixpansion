name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio

      - name: Run omega_prime tests
        run: pytest omega_prime/tests/ -v --tb=short

      - name: Run fractal_engine tests
        run: pytest omega_fractal_engine/tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check all Python files
        run: |
          find . -name '*.py' ! -path './backup/*' ! -path '*__pycache__*' | while read f; do
            python3 -m py_compile "$f"
          done
          echo "All Python files compile cleanly."
