name: Resonance Pulse

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resonance-pulse-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pytest-asyncio
      - name: Gate pulse on complete ALEPH suite
        run: python -m pytest tests/ -q --tb=short
      - name: Capture resonance journals
        run: |
          mkdir -p artifacts
          python -m bridges.resonance_cli --seed 20260823 \
            persist artifacts/baseline.jsonl --label baseline
          python -m bridges.resonance_cli --seed 20260823 \
            persist artifacts/resonance.jsonl --label variation \
            --agent nightly-drift --valence -0.35 --arousal 0.9
          python -m bridges.resonance_cli compare artifacts/baseline.jsonl \
            artifacts/resonance.jsonl > artifacts/oracle.json
          python -m bridges.counterfactual_twin --seed 20260823 twin \
            --output artifacts/counterfactual.json \
            --agent nightly-drift \
            --baseline-valence 0.25 --baseline-arousal 0.75 \
            --twin-valence -0.35 --twin-arousal 0.9
          cat > artifacts/interventions.json <<'JSON'
          {
            "interventions": [{
              "agent": "nightly-drift",
              "baseline": {"valence": 0.25, "arousal": 0.75},
              "twin": {"valence": -0.35, "arousal": 0.9}
            }]
          }
          JSON
          python -m bridges.causal_attribution --seed 20260823 attribute \
            --spec artifacts/interventions.json \
            --output artifacts/causal-attribution.json \
            --target semantic
          python -m bridges.resilience_ledger --seed 20260823 probe \
            --output artifacts/resilience.json \
            --agent nightly-drift \
            --baseline-valence 0.25 --baseline-arousal 0.75 \
            --twin-valence -0.35 --twin-arousal 0.9 \
            --recovery-agent recovery-pulse \
            --recovery-valence 0 --recovery-arousal 0.5 \
            --recovery-steps 4
          python3 - <<'PY'
          import json
          from pathlib import Path

          twin = json.loads(Path("artifacts/counterfactual.json").read_text())
          outcome = twin["timeline"][-1]
          spec = {
              "baseline_state": outcome["baseline_state"],
              "twin_state": outcome["twin_state"],
              "policy": {"default": "union"},
          }
          Path("artifacts/treaty-input.json").write_text(
              json.dumps(spec, sort_keys=True, indent=2) + "\n"
          )
          PY
          python -m bridges.concordance_engine forge \
            --spec artifacts/treaty-input.json \
            --output artifacts/concordance-treaty.json
      - name: Write job summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("artifacts/oracle.json").read_text())
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
              out.write("## Resonance Oracle\n\n")
              out.write(f"- Verdict: `{data['verdict']}`\n")
              out.write(f"- Similarity: `{data['similarity']:.2%}`\n")
              out.write(f"- Baseline: `{data['old_signature'][:12]}`\n")
              out.write(f"- Variation: `{data['new_signature'][:12]}`\n")

          twin = json.loads(Path("artifacts/counterfactual.json").read_text())
          divergence = twin["divergence"]
          out.write("\n## Counterfactual Twin\n\n")
          out.write(f"- First split: `{divergence['kind']}` at step `{divergence['step_index']}`\n")
          out.write(f"- Similarity: `{divergence['similarity']:.2%}`\n")
          out.write(f"- Report: `{twin['report_hash'][:12]}`\n")
          forensics = twin["forensics"]
          out.write("\n## Divergence Forensics\n\n")
          out.write(f"- Classification: `{forensics['classification']}`\n")
          out.write(f"- Camouflage index: `{forensics['camouflage_index']:.2%}`\n")
          out.write(f"- Evidence: `{forensics['evidence_hash'][:12]}`\n")
          if forensics["changed_paths"]:
              out.write(f"- Paths: `{', '.join(forensics['changed_paths'])}`\n")

          attribution = json.loads(Path("artifacts/causal-attribution.json").read_text())
          verdict = attribution["verdicts"][0]
          out.write("\n## Causal Attribution\n\n")
          out.write(f"- Classification: `{verdict['classification']}`\n")
          out.write(f"- Necessary: `{verdict['necessary']}`\n")
          out.write(f"- Sufficient: `{verdict['sufficient']}`\n")
          out.write(f"- Causal mass: `{verdict['causal_mass']:.2f}`\n")
          out.write(f"- Fingerprint: `{attribution['causal_fingerprint'][:12]}`\n")

          resilience = json.loads(Path("artifacts/resilience.json").read_text())
          out.write("\n## Resilience Ledger\n\n")
          out.write(f"- Classification: `{resilience['classification']}`\n")
          out.write(f"- Recovery efficiency: `{resilience['recovery_efficiency']:.2%}`\n")
          out.write(f"- Final semantic repair: `{resilience['final_semantic_recovered']}`\n")
          out.write(f"- Final resonance repair: `{resilience['final_resonance_recovered']}`\n")
          out.write(f"- Evidence: `{resilience['evidence_hash'][:12]}`\n")

          treaty = json.loads(Path("artifacts/concordance-treaty.json").read_text())
          out.write("\n## Concordance Treaty\n\n")
          out.write(f"- Ratified: `{treaty['ratified']}`\n")
          out.write(f"- Clauses: `{treaty['clause_count']}`\n")
          out.write(f"- Preserved conflicts: `{treaty['preserved_conflicts']}`\n")
          out.write(f"- Treaty hash: `{treaty['treaty_hash'][:12]}`\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aleph-resonance-pulse
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
