name: Resonance Pulse

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resonance-pulse-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pytest-asyncio
      - name: Gate pulse on complete ALEPH suite
        run: python -m pytest tests/ -q --tb=short
      - name: Capture resonance journals
        run: |
          mkdir -p artifacts
          python -m bridges.resonance_cli --seed 20260823 \
            persist artifacts/baseline.jsonl --label baseline
          python -m bridges.resonance_cli --seed 20260823 \
            persist artifacts/resonance.jsonl --label variation \
            --agent nightly-drift --valence -0.35 --arousal 0.9
          python -m bridges.resonance_cli compare artifacts/baseline.jsonl \
            artifacts/resonance.jsonl > artifacts/oracle.json
          python -m bridges.counterfactual_twin --seed 20260823 twin \
            --output artifacts/counterfactual.json \
            --agent nightly-drift \
            --baseline-valence 0.25 --baseline-arousal 0.75 \
            --twin-valence -0.35 --twin-arousal 0.9
          cat > artifacts/interventions.json <<'JSON'
          {
            "interventions": [{
              "agent": "nightly-drift",
              "baseline": {"valence": 0.25, "arousal": 0.75},
              "twin": {"valence": -0.35, "arousal": 0.9}
            }]
          }
          JSON
          python -m bridges.causal_attribution --seed 20260823 attribute \
            --spec artifacts/interventions.json \
            --output artifacts/causal-attribution.json \
            --target semantic
          python -m bridges.resilience_ledger --seed 20260823 probe \
            --output artifacts/resilience.json \
            --agent nightly-drift \
            --baseline-valence 0.25 --baseline-arousal 0.75 \
            --twin-valence -0.35 --twin-arousal 0.9 \
            --recovery-agent recovery-pulse \
            --recovery-valence 0 --recovery-arousal 0.5 \
            --recovery-steps 4
          python3 - <<'PY'
          import json
          from pathlib import Path

          twin = json.loads(Path("artifacts/counterfactual.json").read_text())
          outcome = twin["timeline"][-1]
          spec = {
              "baseline_state": outcome["baseline_state"],
              "twin_state": outcome["twin_state"],
              "policy": {"default": "union"},
          }
          Path("artifacts/treaty-input.json").write_text(
              json.dumps(spec, sort_keys=True, indent=2) + "\n"
          )
          PY
          python -m bridges.concordance_engine forge \
            --spec artifacts/treaty-input.json \
            --output artifacts/concordance-treaty.json
      - name: Write job summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def load(path):
              p = Path(path)
              if not p.exists():
                  return None
              try:
                  return json.loads(p.read_text())
              except Exception as e:
                  return {"_error": str(e)}

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
              data = load("artifacts/oracle.json")
              if data and "_error" not in data:
                  out.write("## Resonance Oracle\n\n")
                  out.write(f"- Verdict: `{data.get('verdict')}`\n")
                  out.write(f"- Similarity: `{data.get('similarity', 0):.2%}`\n")
                  out.write(f"- Baseline: `{str(data.get('old_signature', ''))[:12]}`\n")
                  out.write(f"- Variation: `{str(data.get('new_signature', ''))[:12]}`\n")
              elif data:
                  out.write(f"## Resonance Oracle\n\n- Load error: `{data['_error']}`\n")
              else:
                  out.write("## Resonance Oracle\n\n- `artifacts/oracle.json` missing (upstream step failed)\n")

              twin = load("artifacts/counterfactual.json")
              if twin and "_error" not in twin and "divergence" in twin:
                  divergence = twin["divergence"]
                  out.write("\n## Counterfactual Twin\n\n")
                  out.write(f"- First split: `{divergence.get('kind')}` at step `{divergence.get('step_index')}`\n")
                  out.write(f"- Similarity: `{divergence.get('similarity', 0):.2%}`\n")
                  out.write(f"- Report: `{str(twin.get('report_hash', ''))[:12]}`\n")
                  forensics = twin.get("forensics") or {}
                  out.write("\n## Divergence Forensics\n\n")
                  out.write(f"- Classification: `{forensics.get('classification')}`\n")
                  out.write(f"- Camouflage index: `{forensics.get('camouflage_index', 0):.2%}`\n")
                  out.write(f"- Evidence: `{str(forensics.get('evidence_hash', ''))[:12]}`\n")
                  if forensics.get("changed_paths"):
                      out.write(f"- Paths: `{', '.join(forensics['changed_paths'])}`\n")

              attribution = load("artifacts/causal-attribution.json")
              if attribution and "_error" not in attribution and attribution.get("verdicts"):
                  verdict = attribution["verdicts"][0]
                  out.write("\n## Causal Attribution\n\n")
                  out.write(f"- Classification: `{verdict.get('classification')}`\n")
                  out.write(f"- Necessary: `{verdict.get('necessary')}`\n")
                  out.write(f"- Sufficient: `{verdict.get('sufficient')}`\n")
                  out.write(f"- Causal mass: `{verdict.get('causal_mass', 0):.2f}`\n")
                  out.write(f"- Fingerprint: `{str(attribution.get('causal_fingerprint', ''))[:12]}`\n")

              resilience = load("artifacts/resilience.json")
              if resilience and "_error" not in resilience:
                  out.write("\n## Resilience Ledger\n\n")
                  out.write(f"- Classification: `{resilience.get('classification')}`\n")
                  out.write(f"- Recovery efficiency: `{resilience.get('recovery_efficiency', 0):.2%}`\n")
                  out.write(f"- Final semantic repair: `{resilience.get('final_semantic_recovered')}`\n")
                  out.write(f"- Final resonance repair: `{resilience.get('final_resonance_recovered')}`\n")
                  out.write(f"- Evidence: `{str(resilience.get('evidence_hash', ''))[:12]}`\n")

              treaty = load("artifacts/concordance-treaty.json")
              if treaty and "_error" not in treaty:
                  out.write("\n## Concordance Treaty\n\n")
                  out.write(f"- Ratified: `{treaty.get('ratified')}`\n")
                  out.write(f"- Clauses: `{treaty.get('clause_count')}`\n")
                  out.write(f"- Preserved conflicts: `{treaty.get('preserved_conflicts')}`\n")
                  out.write(f"- Treaty hash: `{str(treaty.get('treaty_hash', ''))[:12]}`\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aleph-resonance-pulse
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 30
