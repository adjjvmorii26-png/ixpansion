name: Resonance Pulse

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resonance-pulse-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pytest-asyncio
      - name: Gate pulse on complete ALEPH suite
        run: python -m pytest -q --tb=short
      - name: Capture resonance journals
        run: |
          mkdir -p artifacts
          python -m bridges.resonance_cli --seed 20260823 \
            persist artifacts/baseline.jsonl --label baseline
          python -m bridges.resonance_cli --seed 20260823 \
            persist artifacts/resonance.jsonl --label variation \
            --agent nightly-drift --valence -0.35 --arousal 0.9
          python -m bridges.resonance_cli compare artifacts/baseline.jsonl \
            artifacts/resonance.jsonl > artifacts/oracle.json
          python -m bridges.counterfactual_twin --seed 20260823 twin \
            --output artifacts/counterfactual.json \
            --agent nightly-drift \
            --baseline-valence 0.25 --baseline-arousal 0.75 \
            --twin-valence -0.35 --twin-arousal 0.9
      - name: Write job summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("artifacts/oracle.json").read_text())
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
              out.write("## Resonance Oracle\n\n")
              out.write(f"- Verdict: `{data['verdict']}`\n")
              out.write(f"- Similarity: `{data['similarity']:.2%}`\n")
              out.write(f"- Baseline: `{data['old_signature'][:12]}`\n")
              out.write(f"- Variation: `{data['new_signature'][:12]}`\n")

          twin = json.loads(Path("artifacts/counterfactual.json").read_text())
          divergence = twin["divergence"]
          out.write("\n## Counterfactual Twin\n\n")
          out.write(f"- First split: `{divergence['kind']}` at step `{divergence['step_index']}`\n")
          out.write(f"- Similarity: `{divergence['similarity']:.2%}`\n")
          out.write(f"- Report: `{twin['report_hash'][:12]}`\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aleph-resonance-pulse
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
