name: Wrapper Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wrapper-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile wrapper and tests
        run: python -m py_compile api/atlas_trace_wrapper.py tests/test_wrapper_verification.py
      - name: Run adversarial wrapper regression suite
        run: python -m unittest discover -s tests -p 'test_wrapper_verification.py' -v
