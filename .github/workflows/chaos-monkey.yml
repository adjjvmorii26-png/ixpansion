name: Chaos Monkey

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chaos-monkey-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  chaos-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pytest-asyncio pytest-randomly
      - name: Deterministic shuffled run A
        run: python -m pytest tests/ -q --tb=short -p randomly --randomly-seed=101
      - name: Deterministic shuffled run B
        run: python -m pytest tests/ -q --tb=short -p randomly --randomly-seed=202
      - name: State-core memory soak
        run: |
          python3 - <<'PY'
          from omega_prime.nucleus.kernel.state_core import StateCore

          core = StateCore()
          for index in range(10_000):
              core.set(f"key.{index}", {"data": list(range(10))})
          print(f"Stored {index + 1} entries successfully")
          PY
