name: Mycelium Pulse

on:
  schedule:
    - cron: '40 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mycelium-pulse-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Validate living substrate contracts
        run: python -m pytest mycelium/tests -q --tb=short
      - name: Grow nightly pulse
        run: |
          mkdir -p artifacts
          python -m mycelium.interfaces.cli simulate \
            --seed 20260823 --steps 16 --sites 9 --spores 4 --tail 64 \
            > artifacts/mycelium-pulse.json
      - name: Compile nightly dream
        run: |
          python -m mycelium.interfaces.cli dream \
            --seed 20260823 --steps 18 --sites 9 \
            > artifacts/mycelium-dream.json
      - name: Rehearse astral braids
        run: |
          python -m bridges.astral_braid \
            --dream-file artifacts/mycelium-dream.json \
            --transcript artifacts/astral-bus.jsonl \
            --output artifacts/astral-braid.json
      - name: Grow proof garden
        run: |
          python -m bridges.proof_garden \
            --ledger artifacts/proof-garden.jsonl plant \
            --report artifacts/astral-braid.json \
            --output artifacts/proof-packet.json
          python -m bridges.proof_garden \
            --ledger artifacts/proof-garden.jsonl audit
      - name: Weigh dormant futures
        run: |
          python -m bridges.resurrection_garden \
            --report artifacts/astral-braid.json \
            --proof-packet artifacts/proof-packet.json \
            --contract-file configs/resurrection_contract.json \
            --environment-file configs/resurrection_environment.json \
            --output artifacts/resurrection.json
      - name: Write job summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def load(path):
              p = Path(path)
              if not p.exists():
                  return None
              try:
                  return json.loads(p.read_text())
              except Exception as e:
                  return {"_error": str(e)}

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
              pulse = load("artifacts/mycelium-pulse.json")
              out.write("## Mycelium Pulse\n\n")
              if pulse and "_error" not in pulse and isinstance(pulse.get("stats"), dict):
                  stats = pulse["stats"]
                  out.write(f"- Living tips: `{stats.get('living_tips')}`\n")
                  out.write(f"- Exchanges: `{stats.get('exchanges')}`\n")
                  out.write(f"- Declines: `{stats.get('declines')}`\n")
                  out.write(f"- Remaining nutrient: `{stats.get('substrate_nutrient')}`\n")
              elif pulse and "_error" in pulse:
                  out.write(f"- Load error: `{pulse['_error']}`\n")
              else:
                  out.write("- `artifacts/mycelium-pulse.json` missing or incomplete\n")

              dream_doc = load("artifacts/mycelium-dream.json")
              dream = (dream_doc or {}).get("dream") if isinstance(dream_doc, dict) else None
              if dream:
                  out.write("\n## Compiled Dream\n\n")
                  out.write(f"- Hypothesis: {dream.get('hypothesis')}\n")
                  out.write(f"- Confidence: `{float(dream.get('confidence') or 0):.2%}`\n")
                  out.write(f"- Entropy budget: `{dream.get('entropy_budget')}`\n")
                  out.write(f"- Evidence: `{str(dream.get('evidence_hash', ''))[:12]}`\n")

              braid = load("artifacts/astral-braid.json")
              if braid and "_error" not in braid:
                  out.write("\n## Astral Braid Conservatory\n\n")
                  out.write(f"- Timelines rehearsed: `{len(braid.get('candidates') or [])}`\n")
                  out.write(f"- Selected: `{braid.get('selected_strategy') or 'quarantined'}`\n")
                  out.write(f"- Certificate: `{str(braid.get('certificate_hash', ''))[:12]}`\n")

              proof = load("artifacts/proof-packet.json")
              if proof and "_error" not in proof and isinstance(proof.get("record"), dict):
                  ring = proof["record"]
                  out.write("\n## Proof Garden\n\n")
                  out.write(f"- Growth ring: `{ring.get('sequence')}`\n")
                  out.write(f"- Decision: `{ring.get('kind')}`\n")
                  out.write(f"- Root: `{str(ring.get('root', ''))[:12]}`\n")
                  out.write(f"- Portable proof: `{proof.get('verified')}`\n")

              court = load("artifacts/resurrection.json")
              if court and "_error" not in court:
                  out.write("\n## Resurrection Garden\n\n")
                  out.write(f"- Verdict: `{court.get('verdict')}`\n")
                  out.write(f"- Candidate: `{court.get('selected_strategy') or 'none'}`\n")
                  out.write(f"- Activation: `{court.get('activation_gate', 'not_applicable')}`\n")
                  out.write(f"- Certificate: `{str(court.get('certificate_hash', ''))[:12]}`\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aleph-mycelium-pulse
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 30
