name: Mycelium Pulse

on:
  schedule:
    - cron: '40 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mycelium-pulse-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Validate living substrate contracts
        run: python -m pytest mycelium/tests -q --tb=short
      - name: Grow nightly pulse
        run: |
          mkdir -p artifacts
          python -m mycelium.interfaces.cli simulate \
            --seed 20260823 --steps 16 --sites 9 --spores 4 --tail 64 \
            > artifacts/mycelium-pulse.json
      - name: Compile nightly dream
        run: |
          python -m mycelium.interfaces.cli dream \
            --seed 20260823 --steps 18 --sites 9 \
            > artifacts/mycelium-dream.json
      - name: Rehearse astral braids
        run: |
          python -m bridges.astral_braid \
            --dream-file artifacts/mycelium-dream.json \
            --transcript artifacts/astral-bus.jsonl \
            --output artifacts/astral-braid.json
      - name: Grow proof garden
        run: |
          python -m bridges.proof_garden \
            --ledger artifacts/proof-garden.jsonl plant \
            --report artifacts/astral-braid.json \
            --output artifacts/proof-packet.json
          python -m bridges.proof_garden \
            --ledger artifacts/proof-garden.jsonl audit
      - name: Weigh dormant futures
        run: |
          python -m bridges.resurrection_garden \
            --report artifacts/astral-braid.json \
            --proof-packet artifacts/proof-packet.json \
            --contract-file configs/resurrection_contract.json \
            --environment-file configs/resurrection_environment.json \
            --output artifacts/resurrection.json
      - name: Write job summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          pulse = json.loads(Path("artifacts/mycelium-pulse.json").read_text())
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
              out.write("## Mycelium Pulse\n\n")
              out.write(f"- Living tips: `{pulse['stats']['living_tips']}`\n")
              out.write(f"- Exchanges: `{pulse['stats']['exchanges']}`\n")
              out.write(f"- Declines: `{pulse['stats']['declines']}`\n")
              out.write(f"- Remaining nutrient: `{pulse['stats']['substrate_nutrient']}`\n")

          dream_path = Path("artifacts/mycelium-dream.json")
          if dream_path.exists():
              dream = json.loads(dream_path.read_text()).get("dream")
              if dream:
                  out.write("\n## Compiled Dream\n\n")
                  out.write(f"- Hypothesis: {dream['hypothesis']}\n")
                  out.write(f"- Confidence: `{dream['confidence']:.2%}`\n")
                  out.write(f"- Entropy budget: `{dream['entropy_budget']}`\n")
                  out.write(f"- Evidence: `{dream['evidence_hash'][:12]}`\n")

          braid_path = Path("artifacts/astral-braid.json")
          if braid_path.exists():
              braid = json.loads(braid_path.read_text())
              out.write("\n## Astral Braid Conservatory\n\n")
              out.write(f"- Timelines rehearsed: `{len(braid['candidates'])}`\n")
              out.write(f"- Selected: `{braid['selected_strategy'] or 'quarantined'}`\n")
              out.write(f"- Certificate: `{braid['certificate_hash'][:12]}`\n")

          proof_path = Path("artifacts/proof-packet.json")
          if proof_path.exists():
              planted = json.loads(proof_path.read_text())
              ring = planted["record"]
              out.write("\n## Proof Garden\n\n")
              out.write(f"- Growth ring: `{ring['sequence']}`\n")
              out.write(f"- Decision: `{ring['kind']}`\n")
              out.write(f"- Root: `{ring['root'][:12]}`\n")
              out.write(f"- Portable proof: `{planted['verified']}`\n")

          resurrection_path = Path("artifacts/resurrection.json")
          if resurrection_path.exists():
              court = json.loads(resurrection_path.read_text())
              out.write("\n## Resurrection Garden\n\n")
              out.write(f"- Verdict: `{court['verdict']}`\n")
              out.write(f"- Candidate: `{court['selected_strategy'] or 'none'}`\n")
              out.write(f"- Activation: `{court.get('activation_gate', 'not_applicable')}`\n")
              out.write(f"- Certificate: `{court['certificate_hash'][:12]}`\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aleph-mycelium-pulse
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
