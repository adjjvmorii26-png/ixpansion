name: Culinary dashboard script checks

on:
  pull_request:
    branches: [main]
    paths:
      - "dashboard/culinary.html"
      - ".github/workflows/culinary-script-check.yml"
  push:
    branches: [main]
    paths:
      - "dashboard/culinary.html"
      - ".github/workflows/culinary-script-check.yml"

permissions:
  contents: read

jobs:
  dashboard-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Extract inline scripts and check syntax
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync("dashboard/culinary.html", "utf8");
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)]
            .map((match) => match[1])
            .filter((script) => script.trim());
          if (scripts.length === 0) throw new Error("No inline scripts found");
          fs.writeFileSync("/tmp/culinary-inline.js", scripts.join("\n"));
          NODE
          node --check /tmp/culinary-inline.js
