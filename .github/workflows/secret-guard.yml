name: secret-guard
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  no-hardcoded-telegram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if Telegram bot token hardcoded
        shell: bash
        run: |
          # Search tracked files quietly so a matched secret is never printed to CI logs.
          if git grep -qE '[0-9]{8,}:[A-Za-z0-9_-]{30,}'; then
            echo "::error::Potential hardcoded Telegram bot token found in tracked files; match content suppressed."
            exit 1
          fi
          echo 'No hardcoded Telegram bot token patterns detected in tracked files'
