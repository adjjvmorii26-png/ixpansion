name: secret-guard
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  no-hardcoded-telegram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if Telegram bot token hardcoded
        run: |
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules \
            '[0-9]{8,}:[A-Za-z0-9_-]{30,}' api/ || true; then
            if grep -RInE --exclude-dir=.git \
              'TELEGRAM_BOT_TOKEN".*"[0-9]{8,}:' api/; then
              echo 'Hardcoded TELEGRAM_BOT_TOKEN default found — remove it'
              exit 1
            fi
          fi
          echo 'No hardcoded TELEGRAM_BOT_TOKEN defaults detected in pattern scan'
