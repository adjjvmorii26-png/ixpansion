name: Harbinger Pulse

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: harbinger-pulse-${{ github.ref }}
  cancel-in-progress: false

jobs:
  conclave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Gate on the full suite
        run: python -m pytest tests/ -q --tb=short
      - name: Scout the frontier
        run: |
          python tools/constellation_map.py > constellation.txt 2>&1 || echo "no map"
          python tools/crystal_historian.py > crystal.txt 2>&1 || echo "no crystal"
      - name: Render garden family tree
        run: |
          python tools/garden_family_tree.py > family.txt 2>&1 || echo "no tree"
      - name: Write job summary
        if: always()
        run: |
          echo "## Harbinger Pulse" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          grep -iE "GARDEN|organisms|founders|generations" family.txt >> $GITHUB_STEP_SUMMARY || echo "garden silent" >> $GITHUB_STEP_SUMMARY
