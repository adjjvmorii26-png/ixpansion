name: Integration Bridge Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  bridge-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-asyncio

      - name: Test all three projects together
        run: pytest bridges/test_cross_project.py -v --tb=short

      - name: Verify module imports don't conflict
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, '.')
          sys.path.insert(1, 'omega_prime')
          sys.path.insert(2, 'omega_fractal_engine')
          sys.path.insert(3, 'project_root')

          # Import key modules from each project simultaneously
          from omega_prime.nucleus.kernel.state_core import StateCore
          from omega_prime.nucleus.kernel.reactor import Reactor
          print('omega_prime imports OK')
          "
