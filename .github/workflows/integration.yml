name: Integration Bridge Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pytest-asyncio
      - name: Test cross-project bridge contracts
        run: python -m pytest bridges -q --tb=short
      - name: Verify simultaneous engine imports
        run: |
          python3 - <<'PY'
          from bridges.bridge_core import BridgeHub

          hub = BridgeHub(seed=42)
          assert set(hub.status) == {
              "state_keys", "reactor_events", "chaos", "mood", "mesh_events"
          }
          print("omega_prime + omega_fractal_engine + project_root imports OK")
          PY
