name: Wave 363 dashboard script checks

on:
  pull_request:
    branches: [main]
    paths:
      - "dashboard/wave363.html"
      - ".github/workflows/wave363-script-check.yml"
  push:
    branches: [main]
    paths:
      - "dashboard/wave363.html"
      - ".github/workflows/wave363-script-check.yml"

permissions:
  contents: read

jobs:
  dashboard-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Extract inline scripts and check syntax
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync("dashboard/wave363.html", "utf8");
          const scripts = [...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script>/gi)]
            .map((match) => match[1])
            .filter((script) => script.trim());
          if (scripts.length === 0) throw new Error("No inline scripts found");
          fs.writeFileSync("/tmp/wave363-inline.js", scripts.join("\\n"));
          console.log("Extracted " + scripts.length + " inline script block(s)");
          NODE
          node --check /tmp/wave363-inline.js
