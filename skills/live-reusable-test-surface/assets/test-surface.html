<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Test Surface</title>
<style>
:root{color-scheme:dark;--bg:#0a0d12;--panel:#121821;--line:#263343;--text:#e7edf5;--muted:#93a4b8;--accent:#83e1c1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#0e131b}
.brand{font-weight:750;letter-spacing:.04em;white-space:nowrap}.brand span{color:var(--accent)}
form{display:flex;gap:8px;flex:1;min-width:min(100%,320px)}input,select,button{font:inherit;color:var(--text);background:#0a1017;border:1px solid #344456;border-radius:7px;padding:9px 11px}input{min-width:0;flex:1}button{cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:#16392f;border-color:#2f6b58}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}.status{color:var(--muted);margin-left:auto;overflow-wrap:anywhere}.stage{flex:1;min-height:0;padding:16px;display:flex;justify-content:center;background:radial-gradient(ellipse at top,#131e2b 0,transparent 65%)}
.frame-wrap{width:100%;height:calc(100vh - 145px);min-height:360px;border:1px solid #344456;border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 14px 48px #0006;transition:width .2s;display:flex;flex-direction:column}
.frame-top{height:30px;flex:none;background:#e9eef3;color:#39495b;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:#a5b2c0}.frame-top span:last-child{margin-left:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
iframe{border:0;width:100%;height:100%;background:white;flex:1}
.note{padding:8px 14px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
@media(max-width:700px){header{align-items:stretch}.brand{width:100%}.stage{padding:8px}.frame-wrap{height:calc(100vh - 205px);min-height:300px}.status{width:100%;margin-left:0}}
</style>
</head>
<body>
<header><div class="brand">LIVE <span>TEST SURFACE</span> / v0.1</div>
<form id="loadForm"><input id="target" type="url" placeholder="https://preview.example.com or http://localhost:3000" aria-label="Target URL" autocomplete="url" spellcheck="false" required><button class="primary" type="submit">Load</button></form>
</header>
<div class="toolbar">
<label for="viewport">Viewport</label>
<select id="viewport" aria-label="Viewport size"><option value="100%">Fluid / full width</option><option value="1440px">Desktop · 1440</option><option value="1024px">Laptop · 1024</option><option value="768px">Tablet · 768</option><option value="390px">Mobile · 390</option><option value="360px">Small mobile · 360</option></select>
<button id="reload" type="button">Reload</button><button id="open" type="button">Open separately ↗</button><button id="reset" type="button">Reset</button><span id="status" class="status" role="status" aria-live="polite">Ready · no target loaded</span>
</div>
<main class="stage"><section class="frame-wrap" id="frameWrap" aria-label="Preview frame">
<div class="frame-top"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span id="frameLabel">No target loaded</span></div>
<iframe id="preview" title="Sandboxed live target preview" sandbox="allow-scripts allow-forms allow-modals allow-downloads" referrerpolicy="no-referrer"></iframe>
</section></main>
<div class="note">Sandboxed preview. Some sites prohibit iframe embedding. Cross-origin DOM, console, and network details are intentionally unavailable. Use a browser automation harness for verified test results.</div>
<script>
(() => {
 const form=document.getElementById('loadForm'), input=document.getElementById('target'), frame=document.getElementById('preview'), wrap=document.getElementById('frameWrap'), viewport=document.getElementById('viewport'), status=document.getElementById('status'), label=document.getElementById('frameLabel');
 let current='';
 function setStatus(s){status.textContent=s}
 form.addEventListener('submit',e=>{e.preventDefault();let u;try{u=new URL(input.value.trim())}catch{setStatus('Invalid URL');return}
 if(!['http:','https:'].includes(u.protocol)){setStatus('Blocked: only HTTP(S) URLs are supported');return}
 current=u.href;input.value=current;label.textContent=current;frame.src=current;setStatus('Load requested · embedding may be blocked by target policy');});
 viewport.addEventListener('change',()=>{wrap.style.width=viewport.value;});
 document.getElementById('reload').addEventListener('click',()=>{if(!current){setStatus('No target to reload');return}frame.src=current;setStatus('Reload requested · inspect the page visually');});
 document.getElementById('open').addEventListener('click',()=>{if(!current){setStatus('No target to open');return}window.open(current,'_blank','noopener,noreferrer');setStatus('Opened separately if permitted by browser settings');});
 document.getElementById('reset').addEventListener('click',()=>{frame.removeAttribute('src');current='';input.value='';label.textContent='No target loaded';viewport.value='100%';wrap.style.width='100%';setStatus('Reset · no target loaded');});
 frame.addEventListener('load',()=>{if(current)setStatus('Frame load event received · this does not prove app health');});
})();
</script>
</body></html>
