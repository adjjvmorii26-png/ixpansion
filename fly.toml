app = "ixpansion-organism"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NEXUS_MODE = "production"
  NEXUS_SEED = "42"
  NEXUS_WAVE = "517"
  NEXUS_MODULES = "705"
  NEXUS_ROUTES = "72"
  PYTHONPATH = "/app"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[metrics]
  port = 9090
