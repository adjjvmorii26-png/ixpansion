                  var container = document.getElementById('mynetwork');

                  nodes = new vis.DataSet([{"color": "#2b5c8f", "id": "agent_core", "label": "agent_core", "shape": "dot", "size": 30, "title": "Root Node"}, {"color": "#41b3a3", "id": "fractal_branch_A", "label": "fractal_branch_A", "shape": "dot", "size": 22, "title": "Branch Node"}, {"color": "#e8a87c", "id": "mythic_leaf", "label": "mythic_leaf", "shape": "dot", "size": 15, "title": "Leaf Node"}, {"color": "#e8a87c", "id": "surreal_leaf", "label": "surreal_leaf", "shape": "dot", "size": 15, "title": "Leaf Node"}, {"color": "#e8a87c", "id": "depth_leaf", "label": "depth_leaf", "shape": "dot", "size": 15, "title": "Leaf Node"}, {"color": "#41b3a3", "id": "fractal_branch_B", "label": "fractal_branch_B", "shape": "dot", "size": 22, "title": "Branch Node"}, {"color": "#41b3a3", "id": "dream_branch", "label": "dream_branch", "shape": "dot", "size": 22, "title": "Branch Node"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;

                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"physics": {"solver": "forceAtlas2Based", "forceAtlas2Based": {"gravitationalConstant": -50, "centralGravity": 0.01, "springLength": 100}}};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
