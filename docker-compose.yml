version: "3.8"
services:
  ixpansion-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - VERCEL_DEPLOY_TOKEN=${VERCEL_DEPLOY_TOKEN}
      - NODE_ENV=production
    volumes:
      - ./api:/app/api
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys; sys.path.insert(0, 'api'); import wave410_fusion; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3

  ixpansion-dashboard:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./dashboard:/app/dashboard
    restart: unless-stopped

  ixpansion-nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ixpansion-api
      - ixpansion-dashboard
    restart: unless-stopped

volumes:
  ixpansion_data:
  ixpansion_dashboard:
