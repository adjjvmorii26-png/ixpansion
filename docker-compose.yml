version: "3.8"
services:
  ixpansion:
    build: .
    container_name: ixpansion-organism
    ports:
      - "3000:3000"
    environment:
      - API_PORT=3000
      - API_HOST=0.0.0.0
      - NEXUS_MODE=production
      - NEXUS_SEED=42
    volumes:
      # Persist living state across container restarts
      - ixpansion_data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "org.opencontainers.image.title=IXPANSION"

volumes:
  ixpansion_data:
    driver: local
