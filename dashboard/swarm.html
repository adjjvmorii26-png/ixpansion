<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Wave 422 Swarm</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#0f0f0f;color:#a0a0d0;padding:20px}h1{text-align:center;color:#aaaaff;margin-bottom:4px}.banner{text-align:center;background:#1a1a2a;border-radius:14px;padding:24px;margin-bottom:20px;border:1px solid #2a2a4a}.banner .cells{font-size:2em;color:#aaaaff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;max-width:1200px;margin:0 auto 20px}.card{background:#1a1a2a;border-radius:12px;padding:16px;border:1px solid #2a2a4a}.card h3{color:#aaaaff}.stat{display:flex;justify-content:space-between;padding:5px 0;font-size:.85em;border-bottom:1px solid #2a2a3a}.stat .val{color:#aaaaff}.btn{background:#2a2a4a;color:#aaaaff;border:1px solid #aaaaff;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:.9em;margin:4px}.btn:hover{background:#aaaaff;color:#0f0f0f}</style></head><body><h1>🐝 Wave 422 Swarm</h1><div class="banner"><div class="cells">Cells: <span id="active">--</span>/<span id="total">--</span></div></div><div class="grid"><div class="card"><h3>📊 Status</h3><div id="statsContainer"></div></div><div class="card"><h3>🐝 Colonies</h3><div id="colonyContainer"></div></div></div><div style="text-align:center;margin:20px 0"><button class="btn" onclick="spawn()">🐝 Spawn</button><button class="btn" onclick="pulse()">🔄 Pulse</button></div><script>const API='';async function fetchJson(p){const r=await fetch(API+p);return r.json();}async function load(){try{const s=await fetchJson('/api/swarm?action=status');document.getElementById('active').textContent=s.cells;document.getElementById('total').textContent=s.total;document.getElementById('statsContainer').innerHTML=`<div class="stat"><span>State</span><span class="val">${s.state}</span></div>`;}catch(e){}}async function spawn(){await fetchJson('/api/swarm?action=spawn');load();}async function pulse(){const r=await fetchJson('/api/swarm?action=pulse');document.getElementById('colonyContainer').innerHTML=`<div class="stat"><span>Pulse</span><span class="val">${r.pulse?'✅':'❌'}</span>`;}load();setInterval(load,5000);</script></body></html>
