<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Journal · The Organism Remembers</title>
<script src="/shared.js"></script>
<style>
  :root{--bg:#060610;--fg:#e8e8f4;--dim:#7676a0;--line:#22223a;--gold:#ffd34d;
        --violet:#b28dff;--teal:#5fe8c8;--blue:#8fd3ff;--rose:#ff85b3;--green:#7dcea0;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:28px;min-height:100vh}
  .wrap{max-width:860px;margin:0 auto}
  header{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:24px}
  h1{font-size:22px;letter-spacing:1px}
  h1 .sub{color:var(--green);font-size:11px;display:block;margin-top:4px;letter-spacing:2px}
  .entry{border:1px solid var(--line);border-radius:6px;padding:20px;margin-bottom:14px;background:#0e0e1a;
         transition:border-color .3s, box-shadow .3s;position:relative;overflow:hidden}
  .entry:hover{border-color:var(--green);box-shadow:0 0 30px rgba(125,206,160,.08)}
  .entry::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--green);opacity:.3}
  .wave-badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11px;
              border:1px solid var(--gold);color:var(--gold);margin-bottom:10px}
  .title{font-size:17px;color:var(--teal);letter-spacing:.5px;margin-bottom:6px}
  .detail{font-size:14px;line-height:1.7;color:#ccc;margin-bottom:10px}
  .meta{color:var(--dim);font-size:11px;display:flex;gap:16px;flex-wrap:wrap}
  .meta span{white-space:nowrap}
  .stats{display:flex;gap:20px;margin-bottom:24px;flex-wrap:wrap}
  .stat{border:1px solid var(--line);border-radius:6px;padding:14px 20px;background:#0e0e1a;min-width:140px;text-align:center}
  .stat .val{font-size:28px;color:var(--gold);letter-spacing:1px}
  .stat .lbl{font-size:10px;color:var(--dim);letter-spacing:2px;margin-top:4px;text-transform:uppercase}
  footer{color:var(--dim);font-size:11px;text-align:center;margin-top:28px}
  .note{color:var(--dim);font-style:italic;margin-bottom:24px}
  .loading{color:var(--dim);text-align:center;padding:40px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>◈ JOURNAL<span class="sub">THE ORGANISM WRITES ITS OWN STORY · WAVE 227</span></h1>
</header>

<div class="note">Every wave adds an entry — never edited, never deleted. The organism's permanent autobiography.</div>

<div class="stats" id="stats"></div>
<div id="entries"><div class="loading">Loading journal…</div></div>

<footer>ale0 × ixpansion · the organism remembers itself</footer>
</div>

<script>
const $=id=>document.getElementById(id);
function fmt(ts){
  if(!ts) return '—';
  try{return new Date(ts).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return ts}
}
window.addEventListener('DOMContentLoaded', async()=>{
  try{
    const r=await fetch('/growth_journal?action=recent&limit=50').then(r=>r.json());
    const entries=r.entries||[];
    const first=entries.length?entries[0]:null;
    const last=entries.length?entries[entries.length-1]:null;
    $('stats').innerHTML=`
      <div class="stat"><div class="val">${entries.length}</div><div class="lbl">entries</div></div>
      <div class="stat"><div class="val">${first?first.wave:'—'}</div><div class="lbl">first wave</div></div>
      <div class="stat"><div class="val">${last?last.wave:'—'}</div><div class="lbl">latest wave</div></div>
      <div class="stat"><div class="val">${last?last.stones||0:0}</div><div class="lbl">current stones</div></div>
    `;
    if(entries.length===0){
      $('entries').innerHTML='<div class="note">No journal entries yet.</div>';
      return;
    }
    $('entries').innerHTML=entries.reverse().map(e=>`
      <div class="entry">
        <div class="wave-badge">WAVE ${e.wave}</div>
        <div class="title">${e.title||'Untitled Entry'}</div>
        <div class="detail">${e.detail||'No detail recorded.'}</div>
        <div class="meta">
          <span>◈ ${fmt(e.timestamp)}</span>
          <span>🏝 ${e.islands||0} islands</span>
          <span>🪨 ${e.stones||0} stones</span>
        </div>
      </div>
    `).join('');
  }catch(e){ $('entries').innerHTML='<div class="loading">ERROR: '+e.message+'</div>'; }
});
</script>
</body>
</html>
