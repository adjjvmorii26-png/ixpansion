<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal Journal — The Organism's Living Diary</title>
<style>
  :root{--bg:#05040c;--s:rgba(10,8,22,0.97);--b:rgba(255,255,255,0.07);--t:#a0a0b8;--m:#4a4a64;--ac:#7c7cf8;--te:#2dd4bf;--am:#fbbf24;--vi:#a78bfa;--cy:#22d3ee;--gn:#4ade80;--gd:#f59e0b;--ro:#fb7185}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--t);font-family:'SF Mono','Fira Code',monospace;min-height:100vh;padding:20px}
  .hd{text-align:center;padding:14px 20px;border:1px solid var(--b);border-radius:12px;background:linear-gradient(180deg,rgba(124,124,248,0.07),transparent);margin-bottom:16px}
  .hd h1{font-size:1.4em;color:#fff;letter-spacing:2px;text-transform:uppercase}
  .hd h1 span{color:var(--vi);text-shadow:0 0 18px rgba(167,139,250,0.35)}
  .sub{color:var(--m);font-size:0.75em;margin-top:5px;letter-spacing:1px}
  .sum{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
  .pill{background:var(--s);border:1px solid var(--b);padding:6px 14px;border-radius:20px;font-size:0.66em}
  .pill b{color:#fff}
  .feed{max-width:760px;margin:0 auto;position:relative}
  .feed::before{content:'';position:absolute;left:22px;top:10px;bottom:10px;width:2px;background:linear-gradient(180deg,rgba(124,124,248,0.3),rgba(45,212,191,0.2))}
  .entry{display:flex;gap:14px;padding:10px 0;position:relative}
  .entry .node{flex:0 0 auto;width:46px;font-size:1.3em;text-align:center;background:var(--bg);border:1px solid var(--b);border-radius:50%;height:46px;line-height:42px;z-index:1}
  .entry .card{flex:1;background:var(--s);border:1px solid var(--b);border-radius:10px;padding:12px 14px}
  .entry .card .who{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
  .entry .card .t{color:#fff;font-size:0.82em;font-weight:600}
  .entry .card .st{font-size:0.58em;color:var(--m);letter-spacing:1px;text-transform:uppercase}
  .entry .card .txt{font-size:0.72em;color:var(--m);line-height:1.5;margin-top:4px}
  .entry .card .txt b{color:var(--te);font-weight:600}
  .entry .card .when{font-size:0.6em;color:var(--m);margin-top:6px;font-style:italic}
  .type-broadcast .st{color:var(--te)}
  .type-concerto .st{color:var(--am)}
  .type-offering .st{color:var(--gd)}
  .type-prophecy .st{color:var(--vi)}
  .foot{text-align:center;color:var(--m);font-size:0.62em;margin-top:24px;letter-spacing:1px}
</style>
</head>
<body>
<div class="hd">
  <h1>🜃 Signal <span>Journal</span></h1>
  <div class="sub">THE ORGANISM'S LIVING DIARY · EVERY SEALED SIGNAL IN ONE TIMELINE · WAVE 391</div>
</div>

<div class="sum" id="sum"></div>
<div class="feed" id="feed"></div>
<div class="foot">WAVE 391 · SIGNAL JOURNAL · MEMORY IS THE ORGANISM'S ROOT</div>

<script>
async function get(url){ const r = await fetch(url); return r.json(); }
const ICONS = {broadcast:'📻', concerto:'♪', offering:'🏛', prophecy:'🜁'};
function timeAgo(ts){
  const s = Math.floor((Date.now()/1000 - ts)/60);
  if(!ts) return '';
  if(s < 1) return 'just now';
  if(s < 60) return s + 'm ago';
  if(s < 1440) return Math.floor(s/60) + 'h ago';
  return Math.floor(s/1440) + 'd ago';
}
async function loadJournal(){
  const [f, s] = await Promise.all([get('/api/signal_journal/feed?limit=40'), get('/api/signal_journal/sources')]);
  document.getElementById('sum').innerHTML =
    Object.entries(s.counts||{}).map(([k,v])=>`<span class="pill">${ICONS[k]||'·'} <b>${v}</b> ${k}</span>`).join('') +
    `<span class="pill">total <b>${s.total||0}</b> signals</span>`;
  const feedEl = document.getElementById('feed');
  feedEl.innerHTML = (f.entries||[]).map(e=>`
    <div class="entry type-${e.type}">
      <div class="node">${e.icon}</div>
      <div class="card">
        <div class="who"><span class="t">${e.title}</span><span class="st">${e.type}</span></div>
        <div class="txt">${(e.text||'').replace(/·/g,'<b>·</b>')}</div>
        <div class="when">${timeAgo(e.timestamp)}</div>
      </div>
    </div>`).join('') || '<div style="text-align:center;color:var(--m)">the journal is silent — signals are still seeding.</div>';
}
loadJournal();
setInterval(loadJournal, 60000);
</script>
</body>
</html>
