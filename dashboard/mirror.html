<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Wave 423 Mirror</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#0f0f18;color:#c0c0e0;padding:20px}h1{text-align:center;color:#aa88ff;margin-bottom:4px}.banner{text-align:center;background:#1a0a2a;border-radius:14px;padding:24px;margin-bottom:20px;border:1px solid #3a1a5a}.banner .entangled{font-size:2em;color:#ff66ff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;max-width:1200px;margin:0 auto 20px}.card{background:#1a0a2a;border-radius:12px;padding:16px;border:1px solid #3a1a5a}.card h3{color:#aa88ff}.stat{display:flex;justify-content:space-between;padding:5px 0;font-size:.85em;border-bottom:1px solid #2a1a3a}.stat .val{color:#aa88ff}.btn{background:#2a1a3a;color:#aa88ff;border:1px solid #aa88ff;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:.9em;margin:4px}.btn:hover{background:#aa88ff;color:#0f0f18}</style></head><body><h1>🔮 Wave 423 Mirror</h1><div class="banner"><div class="entangled">Entangled: <span id="entangled">--</span></div></div><div class="grid"><div class="card"><h3>🔗 Fingerprints</h3><div id="fpContainer"></div></div><div class="card"><h3>🔁 Reflect</h3><div id="reflectContainer"></div></div></div><div style="text-align:center;margin:20px 0"><button class="btn" onclick="create()">🔮 Create</button><button class="btn" onclick="reflect()">🔁 Reflect</button></div><script>const API='';async function fetchJson(p){const r=await fetch(API+p);return r.json();}async function load(){try{const s=await fetchJson('/api/mirror?action=status');document.getElementById('entangled').textContent=s.entangled?'✅':'❌';document.getElementById('fpContainer').innerHTML=`<div class="stat"><span>Correlation</span><span class="val">${s.correlation}</span></div>`;}catch(e){}}async function create(){await fetchJson('/api/mirror?action=create');load();}async function reflect(){const r=await fetchJson('/api/mirror?action=reflect');document.getElementById('reflectContainer').innerHTML=`<div class="stat"><span>Reflection</span><span class="val">${r.reflection?'✅':'❌'}</span><div class="stat"><span>Delay</span><span class="val">${r.delay||'0ms'}</span></div>`;}load();setInterval(load,5000);</script></body></html>
