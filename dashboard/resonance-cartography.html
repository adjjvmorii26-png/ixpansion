<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><title>Wave 435 Resonance Cartography</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:ui-monospace,monospace;background:#06060f;color:#9ab;padding:20px}h1{color:#88aaff;font-size:1.1rem;letter-spacing:.15em}.sub{color:#456;margin:8px 0 16px;font-size:.8rem}canvas{display:block;width:100%;max-width:900px;height:420px;background:#0a0a18;border:1px solid #1a2a4a;border-radius:12px}.btn{background:#1a2a5a;color:#88aaff;border:1px solid #88aaff;padding:8px 14px;border-radius:6px;cursor:pointer;margin:8px 4px 0 0}#meta{margin-top:12px;font-size:.75rem;color:#6a7}</style></head>
<body>
<h1>RESONANCE CARTOGRAPHY</h1>
<p class="sub">Wave 435 · energetic topology between modules</p>
<canvas id="c" width="900" height="420"></canvas>
<div><button class="btn" onclick="survey()">Survey</button><button class="btn" onclick="atlas()">Atlas</button></div>
<pre id="meta"></pre>
<script>
const API='';
async function j(p){const r=await fetch(API+p);return r.json();}
function draw(nodes, edges){
  const c=document.getElementById('c'), ctx=c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  const n=nodes.length||1, cx=c.width/2, cy=c.height/2, R=Math.min(cx,cy)-40;
  const pos={};
  nodes.forEach((name,i)=>{const a=(i/n)*Math.PI*2; pos[name]={x:cx+R*Math.cos(a), y:cy+R*Math.sin(a)};});
  ctx.strokeStyle='#334';
  (edges||[]).forEach(e=>{const A=pos[e.a], B=pos[e.b]; if(!A||!B) return; ctx.globalAlpha=Math.min(1,0.2+e.energy); ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke();});
  ctx.globalAlpha=1; ctx.fillStyle='#88aaff';
  nodes.forEach(name=>{const p=pos[name]; ctx.beginPath(); ctx.arc(p.x,p.y,5,0,6.3); ctx.fill(); ctx.fillStyle='#6a7'; ctx.font='10px monospace'; ctx.fillText(name.slice(0,18), p.x+8, p.y); ctx.fillStyle='#88aaff';});
}
async function survey(){
  try{
    const d=await j('/api/resonance-cartography?action=survey&modules=wave431_homestead,wave432_mycelial_index,wave435_resonance_cartography,lab_smoke,doctrine_diff');
    draw(d.nodes||[], d.edges||[]);
    document.getElementById('meta').textContent=JSON.stringify({nodes:d.nodes?.length, edges:d.edges?.length, surveys:d.surveys},null,2);
  }catch(e){
    document.getElementById('meta').textContent='API offline until routes wired — demo graph';
    draw(['homestead','mycelial','cartography','lab','doctrine'],[{a:'homestead',b:'mycelial',energy:0.4},{a:'cartography',b:'lab',energy:0.6}]);
  }
}
async function atlas(){try{const d=await j('/api/resonance-cartography?action=atlas');draw(d.nodes||[],d.edges||[]);}catch(e){survey();}}
survey();
</script>
</body></html>
