<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>IXPANSION · Hush Ticker</title>
<style>
  :root {
    --void: #04050a; --cyan: #3de0ff; --magenta: #ff2d9b;
    --text: #cdd3e0; --dim: #5c6578; --panel: #0b0d14;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--void); color: var(--text);
    font-family: "SF Mono", ui-monospace, monospace;
    min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto;
  }
  header {
    padding: 1.25rem 1.5rem; border-bottom: 1px solid rgba(61,224,255,.08);
    display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { font-size: .75rem; letter-spacing: .28em; text-transform: uppercase; color: var(--cyan); font-weight: 500; }
  .rate-big { font-size: 2.4rem; color: var(--cyan); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .rate-big span { font-size: .9rem; color: var(--dim); margin-left: .4rem; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 0; min-height: 0; }
  .book { padding: 1.25rem 1.5rem; border-right: 1px solid rgba(255,255,255,.04); overflow: auto; }
  .book:last-child { border-right: none; }
  .book h2 { font-size: .6rem; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); margin-bottom: 1rem; }
  .row {
    display: grid; grid-template-columns: 1fr auto auto; gap: .75rem;
    padding: .55rem 0; border-bottom: 1px solid rgba(255,255,255,.03); font-size: .75rem;
  }
  .row .side-h { color: var(--magenta); }
  .row .side-v { color: var(--cyan); }
  .row .amt { font-variant-numeric: tabular-nums; }
  .chart {
    height: 120px; margin: 1rem 1.5rem; background: var(--panel); border-radius: 6px;
    border: 1px solid rgba(61,224,255,.1); position: relative; overflow: hidden;
  }
  canvas { width: 100%; height: 100%; display: block; }
  footer {
    padding: 1rem 1.5rem 1.5rem; display: flex; gap: .75rem; flex-wrap: wrap; align-items: center;
    border-top: 1px solid rgba(255,255,255,.04);
  }
  footer button {
    background: transparent; border: 1px solid var(--dim); color: var(--text);
    font-family: inherit; font-size: .65rem; letter-spacing: .1em; text-transform: uppercase;
    padding: .5rem .9rem; border-radius: 4px; cursor: pointer;
  }
  footer button.accent { border-color: var(--cyan); color: var(--cyan); }
  footer button.mag { border-color: var(--magenta); color: var(--magenta); }
  footer .vol { margin-left: auto; font-size: .7rem; color: var(--dim); }
  footer .vol b { color: var(--text); }
</style>
</head>
<body>
<header>
  <div>
    <h1>Reciprocal Hush · 689</h1>
    <div style="font-size:.65rem;color:var(--dim);margin-top:.35rem;letter-spacing:.08em">hush tokens ↔ void capital</div>
  </div>
  <div class="rate-big" id="rate">1.00<span>h/v</span></div>
</header>
<div class="chart"><canvas id="spark"></canvas></div>
<main>
  <section class="book"><h2>sell hush</h2><div id="hush-book"></div></section>
  <section class="book"><h2>sell void</h2><div id="void-book"></div></section>
</main>
<footer>
  <button class="mag" id="offer-h">offer hush</button>
  <button class="accent" id="offer-v">offer void</button>
  <button id="clear">clear match</button>
  <span class="vol">volume <b id="vol">0.00</b></span>
</footer>
<script>
(() => {
  let rate = 1.0, volume = 0;
  const history = [1.0];
  const offers = { hush: [], void: [] };
  let seq = 0;
  function renderBooks() {
    const hb = document.getElementById('hush-book');
    const vb = document.getElementById('void-book');
    hb.innerHTML = offers.hush.map(o =>
      `<div class="row"><span class="side-h">${o.peer}</span><span class="amt">${o.amount.toFixed(2)}</span><span style="color:var(--dim)">${o.id}</span></div>`
    ).join('') || '<div class="row" style="color:var(--dim)">empty</div>';
    vb.innerHTML = offers.void.map(o =>
      `<div class="row"><span class="side-v">${o.peer}</span><span class="amt">${o.amount.toFixed(2)}</span><span style="color:var(--dim)">${o.id}</span></div>`
    ).join('') || '<div class="row" style="color:var(--dim)">empty</div>';
    document.getElementById('rate').innerHTML = rate.toFixed(2) + '<span>h/v</span>';
    document.getElementById('vol').textContent = volume.toFixed(2);
    spark();
  }
  function spark() {
    const canvas = document.getElementById('spark');
    const ctx = canvas.getContext('2d');
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    if (history.length < 2) return;
    const min = Math.min(...history) * 0.95, max = Math.max(...history) * 1.05;
    ctx.strokeStyle = 'rgba(61,224,255,0.7)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    history.forEach((v, i) => {
      const x = (i / (history.length - 1)) * w;
      const y = h - ((v - min) / (max - min || 1)) * (h - 8) - 4;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.stroke();
  }
  document.getElementById('offer-h').onclick = () => {
    seq++;
    offers.hush.push({ id: 'h' + seq, peer: 'node_' + (seq % 5), amount: 0.5 + Math.random() * 2 });
    if (offers.hush.length > 8) offers.hush.shift();
    renderBooks();
  };
  document.getElementById('offer-v').onclick = () => {
    seq++;
    offers.void.push({ id: 'v' + seq, peer: 'edge_' + (seq % 5), amount: 0.5 + Math.random() * 2 });
    if (offers.void.length > 8) offers.void.shift();
    renderBooks();
  };
  document.getElementById('clear').onclick = () => {
    if (!offers.hush.length || !offers.void.length) return;
    const a = offers.hush.shift(), b = offers.void.shift();
    const qty = Math.min(a.amount, b.amount * rate);
    volume += qty;
    rate = Math.max(0.25, Math.min(4, rate * (1 + 0.02 * (qty > 1 ? 1 : -1))));
    history.push(rate);
    if (history.length > 40) history.shift();
    renderBooks();
  };
  window.addEventListener('resize', spark);
  for (let i = 0; i < 3; i++) { document.getElementById('offer-h').click(); document.getElementById('offer-v').click(); }
  renderBooks();
})();
</script>
</body>
</html>
