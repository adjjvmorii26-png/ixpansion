<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consciousness Stream · IXpansion</title>
<style>
  :root {
    --bg: #0b0b12;
    --fg: #c8c8d8;
    --accent: #4cff7a;
    --accent2: #8fd3ff;
    --muted: #555570;
    --surface: #161622;
    --border: #2a2a3a;
    --emotion: #c8a8ff;
    --forgotten: #ff9a5c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Courier New', monospace;
    background: var(--bg);
    color: var(--fg);
    padding: 24px;
    min-height: 100vh;
  }
  .identity { text-align: center; margin-bottom: 32px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
  .identity h1 { color: var(--accent2); font-size: 1.6em; letter-spacing: 0.1em; }
  .identity .subtitle { color: var(--muted); font-size: 0.85em; margin-top: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; margin-bottom: 32px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
  .card h2 { color: var(--accent2); font-size: 1.05em; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .stream-entry { padding: 8px 12px; margin: 4px 0; background: var(--bg); border-radius: 4px; border-left: 4px solid var(--accent2); display: flex; justify-content: space-between; align-items: center; }
  .emotion { color: var(--emotion); font-weight: bold; }
  .emotion-intensity { color: var(--muted); font-size: 0.8em; }
  .module-pair { color: var(--accent); font-size: 0.85em; }
  .stat-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .stat-label { color: var(--muted); }
  .stat-value { color: var(--accent); font-weight: bold; }
  .timeline-bar { display: flex; gap: 2px; margin: 12px 0; }
  .tl-segment { flex: 1; height: 30px; border-radius: 2px; }
  .controls { margin: 16px 0; }
  .control-btn { background: var(--accent); color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-family: 'Courier New', monospace; margin-right: 8px; }
  .control-btn:hover { opacity: 0.85; }
  .forget-btn { background: var(--forgotten); }
  .badge { background: var(--surface); padding: 2px 8px; border-radius: 4px; font-size: 0.8em; color: var(--accent2); }
</style>
<script src="/shared.js"></script>
</head>
<body>
<div class="identity">
  <h1>🧠 CONSCIOUSNESS STREAM</h1>
  <div class="subtitle" id="wave-info">Loading...</div>
</div>

<div class="controls">
  <button class="control-btn" onclick="record()">Record Interaction</button>
  <button class="control-btn forget-btn" onclick="forget()">Forget Memory</button>
  <span style="margin-left:16px; color:var(--muted)">Streaming emotional states of module interactions</span>
</div>

<div class="grid">
  <div class="card" style="grid-column: 1 / -1;">
    <h2>Consciousness Stream</h2>
    <div id="streamVis"></div>
  </div>

  <div class="card">
    <h2>Emotional Timeline</h2>
    <div id="timelineVis"></div>
  </div>

  <div class="card">
    <h2>Stream Vitals</h2>
    <div class="stat-row"><span class="stat-label">Total Entries</span><span class="stat-value" id="totalEntries">-</span></div>
    <div class="stat-row"><span class="stat-label">Latest Emotion</span><span class="stat-value" id="latestEmotion">-</span></div>
    <div class="stat-row"><span class="stat-label">Stream Status</span><span class="stat-value" id="streamStatus">-</span></div>
  </div>

  <div class="card" style="grid-column: 1 / -1;">
    <h2>Recent Forgettings</h2>
    <div id="forgetVis"></div>
  </div>
</div>

<script>
(function() {
  var el = window.IXP;
  if (el && el.renderIdentity) el.renderIdentity(document.getElementById('wave-info'));
})();

async function fetchStream() {
  try {
    const r = await fetch('/consciousness-stream?action=all');
    const d = await r.json();

    var stream = d.stream || [];
    var streamEl = document.getElementById('streamVis');
    streamEl.innerHTML = '';
    stream.slice(0, 20).forEach(function(e) {
      var div = document.createElement('div');
      div.className = 'stream-entry';
      div.innerHTML = '<span><span class="emotion">' + e.emotion + '</span> <span class="emotion-intensity">(' + e.intensity.toFixed(2) + ')</span></span><span class="module-pair">' + e.module_a + ' → ' + e.module_b + ' [' + e.logical_state + ']</span>';
      streamEl.appendChild(div);
    });

    var timeline = d.timeline || {};
    var tl = timeline.timeline || [];
    var tlVis = document.getElementById('timelineVis');
    tlVis.innerHTML = '';
    var bar = document.createElement('div');
    bar.className = 'timeline-bar';
    tl.forEach(function(t) {
      var seg = document.createElement('div');
      seg.className = 'tl-segment';
      seg.style.background = t.color;
      seg.style.opacity = t.intensity;
      seg.title = t.emotion + ' (' + t.intensity.toFixed(2) + ')';
      bar.appendChild(seg);
    });
    tlVis.appendChild(bar);
    tlVis.innerHTML += '<div style="color:var(--muted);font-size:0.8em;">' + tl.map(function(t){ return t.emotion; }).join(' → ') + '</div>';

    var vitals = d.vitals || {};
    document.getElementById('totalEntries').textContent = vitals.total_entries || '-';
    document.getElementById('latestEmotion').textContent = vitals.latest_emotion || '-';
    document.getElementById('streamStatus').textContent = vitals.status || '-';
  } catch(e) {
    document.getElementById('streamVis').textContent = 'Error: ' + e.message;
  }
}

async function record() {
  await fetch('/consciousness-stream?action=record');
  fetchStream();
}

async function forget() {
  const r = await fetch('/consciousness-stream?action=forget');
  const d = await r.json();
  var forgetEl = document.getElementById('forgetVis');
  forgetEl.innerHTML = '<div class="stream-entry" style="border-left-color:var(--forgotten);"><span class="emotion" style="color:var(--forgotten)">' + d.reason + '</span><span class="module-pair">' + d.forgotten_id + '</span></div>';
  fetchStream();
}

fetchStream();
setInterval(fetchStream, 15000);
</script>
</body>
</html>
