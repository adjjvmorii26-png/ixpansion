<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Symbiosis Protocol — IXPANSION</title>
<style>
:root{--bg:#0a0a14;--fg:#e0e0e8;--muted:#6b6b80;--cyan:#41b3a3;--magenta:#c063e8;--card:#14142a;--border:#2a2a44;--green:#41d3a3;--amber:#ffcc66;--red:#e05a5a;--blue:#6fa8dc}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--fg);padding:20px}
.header{text-align:center;margin-bottom:24px;border-bottom:2px solid var(--border);padding-bottom:16px}
h1{font-size:2em;background:linear-gradient(135deg,var(--green),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--muted);margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;max-width:1400px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.card h2{color:var(--green);font-size:1.1em;margin-bottom:12px}
.metric{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #222}
.metric:last-child{border-bottom:none}
.label{color:var(--muted)}
.value{color:var(--cyan);font-weight:bold}
.btn{background:var(--green);border:none;color:#0a0a14;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:bold;margin:4px}
.btn:hover{opacity:0.9}
.partner{padding:10px;background:#1a2a2a;border:1px solid var(--green);border-radius:8px;margin:6px 0}
.partner-name{color:var(--amber);font-weight:bold}
.partner-status{display:inline-block;padding:2px 8px;border-radius:12px;font-size:0.8em;margin-left:8px}
.joint{background:var(--green);color:#0a0a14}
.courting{background:var(--amber);color:#0a0a14}
.resonance-bar{height:6px;border-radius:3px;background:#333;overflow:hidden;margin:4px 0}
.resonance-fill{height:100%;border-radius:3px}
input{background:#2a2a44;color:var(--fg);border:1px solid #444;padding:6px 10px;border-radius:6px;margin:4px;width:180px}
</style>
</head>
<body>
<div class="header">
  <h1>🤝 Symbiosis Protocol</h1>
  <p class="sub">Cross-repo partnerships, trust negotiation, resource sharing</p>
  <span class="badge" id="count" style="background:#2a2a44;color:var(--green);padding:4px 12px;border-radius:12px">partners: 0</span>
</div>
<div class="grid">
  <div class="card">
    <h2>🤖 Engage Partner</h2>
    <input id="partner-id" placeholder="partner id (e.g. nexus-observatory)">
    <button class="btn" onclick="engage()">🤝 Engage</button>
    <div id="engage-result" style="margin-top:12px"></div>
  </div>
  <div class="card">
    <h2>🔗 Active Partners</h2>
    <div id="partners">No partners yet</div>
  </div>
  <div class="card">
    <h2>⚙ Protocol</h2>
    <div id="protocol-info">Loading...</div>
  </div>
  <div class="card">
    <h2>📡 Recent Handshakes</h2>
    <div id="handshakes">None</div>
  </div>
</div>
<script>
const HOST='';
async function api(action){
  const r = await fetch(HOST+'/api/symbiosis?action='+action);
  return r.json();
}
async function refresh(){
  const s = await api('status');
  document.getElementById('count').textContent = 'partners: '+s.total_partners+' / joint: '+s.joint_partners;
  if(s.partner_list.length){
    document.getElementById('partners').innerHTML = s.partner_list.map(p=>
      `<div class="partner"><span class="partner-name">${p.partner}</span>
       <span class="partner-status ${p.status}">${p.status}</span>
       <div style="margin-top:4px;font-size:0.85em;color:var(--muted)">
         trust: ${p.trust} · platform: ${p.platform}
         ${p.capabilities.length?' · '+p.capabilities.join(', '):''}
       </div></div>`).join('');
  } else {
    document.getElementById('partners').textContent = 'No partners yet';
  }
  document.getElementById('protocol-info').innerHTML =
    `<div class="metric"><span class="label">Version</span><span class="value">${s.protocol_version}</span></div>`;
  if(s.recent_handshakes.length){
    document.getElementById('handshakes').innerHTML = s.recent_handshakes.map(h=>
      `<div class="metric"><span class="label">${h.partner} (${h.platform})</span><span class="value">${h.state}</span></div>`).join('');
  }
}
async function engage(){
  const pid = document.getElementById('partner-id').value.trim();
  if(!pid)return;
  const r = await fetch(HOST+'/api/symbiosis?action=engage&partner_id='+encodeURIComponent(pid));
  const d = await r.json();
  document.getElementById('engage-result').innerHTML =
    `<div class="metric"><span class="label">${d.partner||pid}</span><span class="value" style="color:var(--green)">${d.status}</span></div>`;
  document.getElementById('partner-id').value='';
  await refresh();
}
refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
