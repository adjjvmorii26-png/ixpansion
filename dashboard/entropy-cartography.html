<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entropy Cartography — Chaos Terrain Map</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#02020a;color:#e0e0e0;font-family:'Courier New',monospace;overflow-x:hidden}
.scanline{position:fixed;top:0;left:0;right:0;height:2px;background:rgba(124,124,248,0.08);z-index:9999;animation:scan 4s linear infinite;pointer-events:none}
@keyframes scan{0%{top:-2px}100%{top:100vh}}
.header{text-align:center;padding:30px 20px;border-bottom:1px solid rgba(124,124,248,0.15)}
.header h1{font-size:1.8em;color:#7c7cf8;text-shadow:0 0 30px rgba(124,124,248,0.4)}
.header .sub{color:#2dd4bf;font-size:0.85em;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;padding:20px}
.card{background:rgba(15,15,25,0.9);border:1px solid rgba(124,124,248,0.12);border-radius:12px;padding:20px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#7c7cf8,transparent)}
.card h2{font-size:1em;color:#7c7cf8;margin-bottom:12px;text-transform:uppercase;letter-spacing:2px}
.zone-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.zone{padding:10px;border-radius:8px;text-align:center;font-size:0.75em;transition:all 0.3s}
.zone:hover{transform:scale(1.05)}
.zone-frozen{background:rgba(45,212,191,0.15);border:1px solid rgba(45,212,191,0.3);color:#2dd4bf}
.zone-stable{background:rgba(124,124,248,0.12);border:1px solid rgba(124,124,248,0.3);color:#7c7cf8}
.zone-temperate{background:rgba(232,168,124,0.12);border:1px solid rgba(232,168,124,0.3);color:#e8a87c}
.zone-chaos{background:rgba(200,60,60,0.15);border:1px solid rgba(200,60,60,0.3);color:#ff6b6b}
.zone-void{background:rgba(100,20,120,0.15);border:1px solid rgba(100,20,120,0.3);color:#c77dff}
canvas{width:100%;border-radius:8px;background:rgba(5,5,15,0.8);margin-top:12px}
.stat{text-align:center;padding:15px}
.stat .val{font-size:2em;color:#2dd4bf;font-weight:bold}
.stat .label{font-size:0.7em;color:#666;text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.btn{background:rgba(124,124,248,0.15);border:1px solid rgba(124,124,248,0.3);color:#7c7cf8;padding:8px 20px;border-radius:8px;cursor:pointer;font-family:monospace;font-size:0.85em;transition:all 0.3s}
.btn:hover{background:rgba(124,124,248,0.3)}
#terrain-canvas{height:300px}
.hotspot-list{max-height:200px;overflow-y:auto;font-size:0.8em}
.hotspot-item{padding:6px 0;border-bottom:1px solid rgba(124,124,248,0.08);display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="scanline"></div>
<div class="header">
<h1>熵 ENTROPY CARTOGRAPHY</h1>
<div class="sub">Chaos Terrain Mapping — Entropy Landscape Visualization</div>
</div>
<div class="grid">
<div class="card" style="grid-column:span 2">
<h2>Terrain Scan</h2>
<canvas id="terrain-canvas"></canvas>
<div style="margin-top:12px;text-align:center">
<button class="btn" onclick="scanTerrain()">SCAN TERRAIN</button>
<button class="btn" onclick="clearCanvas()">RESET</button>
</div>
</div>
<div class="card">
<h2>Global Entropy</h2>
<div class="stat"><div class="val" id="global-entropy">0.0000</div><div class="label">across 12 domains</div></div>
<div class="stat" style="margin-top:10px"><div class="val" id="stability-index" style="color:#7c7cf8">0.0000</div><div class="label">stability index</div></div>
</div>
<div class="card">
<h2>Zone Classification</h2>
<div class="zone-grid" id="zone-grid"></div>
</div>
<div class="card">
<h2>Entropy Hotspots</h2>
<div class="hotspot-list" id="hotspots"></div>
</div>
<div class="card">
<h2>Stability Pockets</h2>
<div class="hotspot-list" id="cold-zones"></div>
</div>
<div class="card">
<h2>Gradient Monitor</h2>
<canvas id="gradient-canvas" height="150"></canvas>
</div>
</div>
<a class="back-btn" href="index.html" style="position:fixed;bottom:20px;right:20px;background:rgba(124,124,248,0.15);color:#7c7cf8;padding:8px 16px;border-radius:8px;text-decoration:none;font-family:monospace;font-size:13px;border:1px solid rgba(124,124,248,0.3);z-index:9999;backdrop-filter:blur(8px)">← Organism</a>
<script>
const DOMAIN_NAMES = ['neural','temporal','spatial','quantum','organic','fractal','void','crystalline','molten','spectral','chrono','paradox'];
const ZONE_CLASSES = ['frozen_wasteland','stable_cathedral','temperate_meadow','chaos_storm','entropy_void'];
const ZONE_COLORS = {'frozen_wasteland':'#2dd4bf','stable_cathedral':'#7c7cf8','temperate_meadow':'#e8a87c','chaos_storm':'#ff6b6b','entropy_void':'#c77dff'};
let terrainData = {};

function scanTerrain() {
  terrainData = {};
  DOMAIN_NAMES.forEach(d => {
    const entropy = Math.random();
    const gradient = (Math.random() - 0.5) * 2;
    let zone = 'temperate_meadow';
    if (entropy < 0.2) zone = 'frozen_wasteland';
    else if (entropy < 0.4) zone = 'stable_cathedral';
    else if (entropy < 0.6) zone = 'temperate_meadow';
    else if (entropy < 0.8) zone = 'chaos_storm';
    else zone = 'entropy_void';
    terrainData[d] = { entropy, gradient, zone, stability: 1 - entropy };
  });
  const avg = Object.values(terrainData).reduce((s, v) => s + v.entropy, 0) / DOMAIN_NAMES.length;
  document.getElementById('global-entropy').textContent = avg.toFixed(4);
  document.getElementById('stability-index').textContent = (1 - avg).toFixed(4);
  drawTerrain();
  drawGradient();
  renderZones();
  renderHotspots();
  renderColdZones();
}

function drawTerrain() {
  const c = document.getElementById('terrain-canvas');
  c.width = c.offsetWidth;
  c.height = 300;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#05050f';
  ctx.fillRect(0, 0, c.width, c.height);
  const domains = Object.keys(terrainData);
  const segW = c.width / domains.length;
  domains.forEach((d, i) => {
    const e = terrainData[d].entropy;
    const h = e * 250;
    const color = ZONE_COLORS[terrainData[d].zone] || '#7c7cf8';
    ctx.fillStyle = color + '33';
    ctx.fillRect(i * segW, 300 - h, segW - 2, h);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(i * segW + segW / 2, 300 - h);
    for (let j = 0; j < 5; j++) {
      const y = 300 - h + Math.sin(Date.now() / 500 + i + j) * 3;
      ctx.lineTo(i * segW + segW / 2, y);
    }
    ctx.stroke();
    ctx.fillStyle = '#888';
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(d.substring(0, 6), i * segW + segW / 2, 290);
  });
}

function drawGradient() {
  const c = document.getElementById('gradient-canvas');
  c.width = c.offsetWidth;
  c.height = 150;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#05050f';
  ctx.fillRect(0, 0, c.width, c.height);
  const domains = Object.keys(terrainData);
  if (domains.length < 2) return;
  const segW = c.width / (domains.length - 1);
  ctx.beginPath();
  ctx.moveTo(0, 150 - terrainData[domains[0]].entropy * 140);
  domains.forEach((d, i) => {
    if (i === 0) return;
    const y = 150 - terrainData[d].entropy * 140;
    ctx.lineTo(i * segW, y);
  });
  ctx.strokeStyle = '#2dd4bf';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function renderZones() {
  const grid = document.getElementById('zone-grid');
  grid.innerHTML = '';
  const counts = {};
  Object.values(terrainData).forEach(v => { counts[v.zone] = (counts[v.zone] || 0) + 1; });
  Object.entries(counts).forEach(([zone, count]) => {
    const el = document.createElement('div');
    const cls = zone === 'frozen_wasteland' ? 'zone-frozen' : zone === 'stable_cathedral' ? 'zone-stable' : zone === 'temperate_meadow' ? 'zone-temperate' : zone === 'chaos_storm' ? 'zone-chaos' : 'zone-void';
    el.className = 'zone ' + cls;
    el.innerHTML = `<div style="font-weight:bold">${count}</div><div>${zone.replace('_', ' ')}</div>`;
    grid.appendChild(el);
  });
}

function renderHotspots() {
  const list = document.getElementById('hotspots');
  list.innerHTML = '';
  const hot = Object.entries(terrainData).filter(([,v]) => v.entropy > 0.6).sort((a,b) => b[1].entropy - a[1].entropy);
  if (!hot.length) { list.innerHTML = '<div style="color:#666;padding:10px">No high-entropy zones</div>'; return; }
  hot.forEach(([d, v]) => {
    list.innerHTML += `<div class="hotspot-item"><span style="color:${ZONE_COLORS[v.zone]}">${d}</span><span>${v.entropy.toFixed(3)} E</span></div>`;
  });
}

function renderColdZones() {
  const list = document.getElementById('cold-zones');
  list.innerHTML = '';
  const cold = Object.entries(terrainData).filter(([,v]) => v.entropy < 0.4).sort((a,b) => a[1].entropy - b[1].entropy);
  if (!cold.length) { list.innerHTML = '<div style="color:#666;padding:10px">No stability pockets</div>'; return; }
  cold.forEach(([d, v]) => {
    list.innerHTML += `<div class="hotspot-item"><span style="color:#2dd4bf">${d}</span><span>${v.stability.toFixed(3)} S</span></div>`;
  });
}

function clearCanvas() {
  terrainData = {};
  document.getElementById('global-entropy').textContent = '0.0000';
  document.getElementById('stability-index').textContent = '0.0000';
  document.getElementById('zone-grid').innerHTML = '';
  document.getElementById('hotspots').innerHTML = '';
  document.getElementById('cold-zones').innerHTML = '';
  const c = document.getElementById('terrain-canvas');
  c.getContext('2d').clearRect(0, 0, c.width, c.height);
}

scanTerrain();
</script>
</body>
</html>
