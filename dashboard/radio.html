<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mycelial Radio — The Undernet Broadcasts</title>
<style>
  :root{--bg:#04070a;--s:rgba(6,16,14,0.96);--b:rgba(74,222,128,0.14);--t:#9fb8a8;--m:#4a6a5a;--ac:#4ade80;--te:#2dd4bf;--am:#fbbf24;--vi:#a78bfa;--cy:#22d3ee}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--t);font-family:'SF Mono','Fira Code',monospace;min-height:100vh;padding:20px}
  .hd{text-align:center;padding:14px 20px;border:1px solid var(--b);border-radius:12px;background:linear-gradient(180deg,rgba(74,222,128,0.06),transparent);margin-bottom:18px}
  .hd h1{font-size:1.4em;color:#fff;letter-spacing:2px;text-transform:uppercase}
  .hd h1 span{color:var(--ac);text-shadow:0 0 18px rgba(74,222,128,0.4)}
  .sub{color:var(--m);font-size:0.75em;margin-top:5px;letter-spacing:1px}
  .console{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:18px;max-width:820px;margin:0 auto 18px}
  .freq{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:14px;font-size:1.6em;color:var(--ac);letter-spacing:2px;text-shadow:0 0 20px rgba(74,222,128,0.5)}
  .dial{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
  button{background:rgba(74,222,128,0.1);border:1px solid rgba(74,222,128,0.35);color:#fff;padding:8px 16px;border-radius:8px;font-family:inherit;font-size:0.72em;cursor:pointer;letter-spacing:1px}
  button:hover{background:rgba(74,222,128,0.25)}
  .sig{display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(74,222,128,0.08);padding:9px 4px;font-size:0.75em}
  .sig .badge{background:rgba(74,222,128,0.12);color:var(--ac);border:1px solid rgba(74,222,128,0.3);padding:2px 8px;border-radius:20px;font-size:0.62em}
  .sig .pair{color:#fff;flex:1}
  .sig .str{color:var(--am);font-weight:700}
  .line{color:var(--m);font-size:0.72em;padding:2px 0}
  .line b{color:var(--te)}
  .poster{margin-top:14px;border-top:1px solid rgba(74,222,128,0.15);padding-top:12px}
  .poster .headline{color:#fff;font-size:0.9em;line-height:1.5}
  .poster .weather{color:var(--am);font-size:0.72em;margin-top:6px}
  .poster .verse{color:var(--vi);font-size:0.7em;line-height:1.7;margin-top:8px;white-space:pre-line}
  .poster .omen{color:var(--m);font-size:0.65em;margin-top:6px;font-style:italic}
  .foot{text-align:center;color:var(--m);font-size:0.62em;margin-top:22px;letter-spacing:1px}
  .typer{animation:blink 1s steps(2) infinite}
  .map-wrap{position:relative;border:1px solid rgba(74,222,128,0.12);border-radius:10px;overflow:hidden;margin-top:14px}
  canvas{display:block;width:100%;height:340px;background:radial-gradient(ellipse at center, rgba(74,222,128,0.05), transparent 70%)}
  .map-hint{position:absolute;top:8px;left:12px;font-size:0.62em;color:var(--m);letter-spacing:1px}
  .ticker{margin-top:10px;font-size:0.68em;color:var(--te);letter-spacing:1px;min-height:1.4em}
  @keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div class="hd">
  <h1>≋ Mycelial <span>Radio</span></h1>
  <div class="sub">THE UNDERNET BROADCASTS · HIDDEN RESONANCES SURFACE · WAVE 386</div>
</div>

<div class="console">
  <div class="freq" id="freq">≋ 93.42<span class="typer">▮</span></div>
  <div class="dial">
    <button onclick="scanNow()">📡 Scan</button>
    <button onclick="broadcastNow()">📻 Broadcast</button>
    <button onclick="tuneRandom()">🔀 Tune Random</button>
  </div>
  <div id="signals"></div>
  <div class="poster" id="poster"></div>
  <div class="map-wrap">
    <div class="map-hint">UNDERNET VEIN MAP — CLICK A NODE TO TUNE</div>
    <canvas id="vein"></canvas>
  </div>
  <div class="ticker" id="ticker"></div>
</div>
<div class="foot">WAVE 386 · MYCELIAL RADIO · TUNE IN · THE ORGANISM SPEAKS IN SIGNALS</div>

<script>
async function get(url){ const r = await fetch(url); return r.json(); }
let tuned = 'resonance_graph';
async function scanNow(){
  const d = await get('/api/mycelial_radio/scan?limit=64');
  const el = document.getElementById('signals');
  el.innerHTML = '<div class="line"><b>SCAN</b> — examined ' + d.examined + ' hidden pairs · ' + d.resonance_pairs.length + ' strong signals</div>' +
    (d.resonance_pairs||[]).map(p=>`<div class="sig"><span class="pair">${p.a.replace(/_/g,' ')} <span style="color:var(--m)">↔</span> ${p.b.replace(/_/g,' ')}</span><span class="badge">${p.band}</span><span class="str">${(p.strength*100).toFixed(0)}%</span></div>`).join('') +
    '<div class="line" style="margin-top:8px">' + ((d.resonance_pairs||[])[0]||{}).aphorism + '</div>';
}
async function broadcastNow(){
  const d = await get('/api/mycelial_radio/broadcast');
  const b = d.bulletin;
  const el = document.getElementById('poster');
  el.innerHTML = '<div class="headline">📻 ' + b.headline + '</div>' +
    '<div class="weather">☂ ' + b.weather + '</div>' +
    '<div class="verse">' + b.verse + '</div>' +
    '<div class="omen">omen — ' + b.omen + '</div>' +
    '<div class="line" style="margin-top:8px"><b>top signals</b><br>' + (b.top_signals||[]).map(s=>'· '+s).join('<br>') + '</div>';
}
async function tuneRandom(){
  const names = ['resonance_graph','dream_logic_physics','entropy_oracle','paradox_ledger','mythopoetic_engine','consciousness_stream','worker_council','memory_palace_gen','void_cartographer','synchronicity_engine'];
  tuned = names[Math.floor(Math.random()*names.length)];
  await tune(tuned);
}
async function tune(module){
  const d = await get('/api/mycelial_radio/tune?module=' + encodeURIComponent(module));
  tuned = d.module;
  document.getElementById('freq').textContent = `≋ ${d.frequency} · ${d.band.toUpperCase()} · ${d.module.replace(/_/g,' ')}`;
  const el = document.getElementById('signals');
  el.innerHTML = '<div class="line"><b>TUNED</b> — ' + d.module.replace(/_/g,' ') + ' · nearest neighbors:</div>' +
    (d.neighbors||[]).map(n=>`<div class="sig"><span class="pair">${n.module.replace(/_/g,' ')}</span><span class="str">${(n.strength*100).toFixed(0)}%</span></div>`).join('') +
    '<div class="line" style="margin-top:8px">' + (d.doctrine||'') + '</div>';
}
const BAND_COLORS = {alpha:'#4ade80',beta:'#2dd4bf',gamma:'#22d3ee',delta:'#a78bfa',theta:'#fbbf24',mycelial:'#86efac',dream:'#c084fc',void:'#64748b',census:'#f59e0b',lattice:'#38bdf8'};
let MAP = {nodes:[],edges:[]};
async function loadMap(){
  MAP = await get('/api/mycelial_radio/map?limit=36');
  drawMap();
}
function drawMap(){
  const cv = document.getElementById('vein');
  const ctx = cv.getContext('2d');
  const W = cv.width = cv.offsetWidth || 800;
  const H = cv.height = 340;
  ctx.clearRect(0,0,W,H);
  const cx = W/2, cy = H/2;
  const pos = {};
  MAP.nodes.forEach(n=>{
    const ringR = 40 + (n.ring % 4) * (Math.min(W,H)/2 - 48) / 4;
    const ang = n.angle * Math.PI * 2;
    const x = cx + Math.cos(ang) * ringR;
    const y = cy + Math.sin(ang) * ringR * 0.8;
    pos[n.id] = [x,y];
  });
  MAP.edges.forEach(e=>{
    const [x1,y1] = pos[e.a]||[0,0];
    const [x2,y2] = pos[e.b]||[0,0];
    ctx.strokeStyle = 'rgba(74,222,128,' + (0.08 + e.strength*0.35).toFixed(3) + ')';
    ctx.lineWidth = 0.6 + e.strength * 1.6;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  });
  MAP.nodes.forEach(n=>{
    const [x,y] = pos[n.id];
    ctx.fillStyle = BAND_COLORS[n.band] || '#4ade80';
    ctx.globalAlpha = 0.85;
    ctx.beginPath(); ctx.arc(x,y, 2.5 + Math.min(n.degree,8)*0.7, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    if(n.degree >= 3){
      ctx.fillStyle = '#b8d8c8';
      ctx.font = '9px monospace';
      ctx.fillText(n.id.replace(/_/g,' '), x+6, y+3);
    }
  });
  cv.onclick = ev=>{
    const rect = cv.getBoundingClientRect();
    const mx = (ev.clientX-rect.left) * W/rect.width, my = (ev.clientY-rect.top) * H/rect.height;
    let best=null, bd=1e9;
    MAP.nodes.forEach(n=>{
      const [x,y] = pos[n.id];
      const d = Math.hypot(mx-x, my-y);
      if(d<bd && d<22){ bd=d; best=n.id; }
    });
    if(best) tune(best);
  };
}
async function ticker(){
  const d = await get('/api/mycelial_radio/broadcast');
  const b = d.bulletin;
  document.getElementById('ticker').textContent = '≋ ' + b.headline + ' — ☂ ' + b.weather;
}
scanNow();
loadMap();
ticker();
setInterval(ticker, 90000);
</script>
</body>
</html>
