<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucid Machines — Prototyp</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0d;color:#c8c8c8;font-family:'Courier New',monospace;font-size:13px;min-height:100vh;display:flex;flex-direction:column;overflow:hidden}
#banner{text-align:center;padding:8px;background:linear-gradient(180deg,#151526,#0a0a0d);border-bottom:1px solid #2a2a3a;color:#fff;font-size:14px;letter-spacing:2px;flex-shrink:0}
#banner .sub{color:#6a6;font-size:10px;margin-top:2px;letter-spacing:1px}
#game{flex:1;display:flex;flex-direction:column;padding:4px 8px;overflow:hidden;min-height:0}
#viewport{flex:1;white-space:pre-wrap;font-size:11px;line-height:1.5;color:#a8c;padding:4px;background:#0d0d12;border:1px solid #15151f;border-radius:3px;overflow-y:auto;word-break:break-word}
#controls{display:flex;gap:2px;padding:3px 4px;flex-wrap:wrap;justify-content:center;background:#0a0a0c;flex-shrink:0}
.btn{background:#12121e;color:#8a8;border:1px solid #333;padding:3px 6px;border-radius:2px;cursor:pointer;font-family:inherit;font-size:11px;transition:all .1s}
.btn:hover{background:#22223a;color:#fff;border-color:#668}
.btn:active{transform:scale(0.95)}
#status{padding:4px 8px;background:#111;border-top:1px solid #222;font-size:10px;flex-shrink:0}
#mode{padding:4px 8px;background:#111;border-top:1px solid #222;font-size:10px;flex-shrink:0}
</style>
</head>
<body>
<div id="banner">LUCID MACHINES <div class="sub">The Echo Chamber Principle — a co-pilot prototype</div></div>
<div id="game">
  <div id="viewport"></div>
  <div id="controls"></div>
</div>
<div id="status"></div>
<div id="mode"></div>

<script>
// ══════════════════════════════════════════════════════════════
// LUCID MACHINES — THE ECHO CHAMBER PROTOTYPE
// ══════════════════════════════════════════════════════════════
// A minimal demo of Luma's design: the world bends to player behavior

let state = {
  // Action tracking
  actionCounts: {
    combat: 0,
    explore: 0,
    silence: 0,
    build: 0,
    trade: 0,
    curiosity: 0
  },
  
  // Mood state
  mood: 'neutral', // 'light' | 'neutral' | 'heavy'
  moodShift: 0,
  
  // World state
  world: {
    pathways: 8,
    creatures: 4,
    secrets: 3,
    depth: 0
  },
  
  // Prompt state
  promptsRemaining: 3,
  promptHistory: [],
  
  // Player
  turns: 0
};

const ACTIONS = {
  combat: 'combat',
  explore: 'explore', 
  silence: 'silence',
  build: 'build',
  trade: 'trade',
  curiosity: 'curiosity'
};

const ACTION_LABELS = {
  combat: 'Fight',
  explore: 'Explore',
  silence: 'Stay Silent',
  build: 'Build',
  trade: 'Trade',
  curiosity: 'Show Curiosity'
};

// Initialize world
function initWorld() {
  state.world = {
    pathways: 8 + Math.floor(Math.random() * 3),
    creatures: 2 + Math.floor(Math.random() * 4),
    secrets: 1 + Math.floor(Math.random() * 3),
    depth: 0
  };
  state.mood = 'neutral';
  state.moodShift = 0;
  state.turns = 0;
  state.actionCounts = {
    combat: 0, explore: 0, silence: 0, build: 0, trade: 0, curiosity: 0
  };
  state.promptsRemaining = 3;
  state.promptHistory = [];
  state.world.pathways = 8;
  state.world.creatures = 2;
  state.world.secrets = 1;
  
  renderViewport();
  renderMode();
  renderControls();
}

// Render the world view
function renderViewport() {
  const el = document.getElementById('viewport');
  const w = state.world;
  const a = state.actionCounts;
  const m = state.mood;
  
  let html = '';
  
  // World state description
  html += `  ╔══════════════════════════════════════════════════╗\n`;
  html += `  ║  ${'LUCID MACHINES'.padEnd(38)} ║\n`;
  html += `  ╠═════════════════════════════════════════════════╣\n`;
  html += `  ║  ${'DEPTH'.padEnd(6)}${state.turns}  ${'PATHWAYS'.padEnd(8)}${w.pathways}  ${'CREATURES'.padEnd(9)}${w.creatures}  ${'SECRETS'.padEnd(7)}${w.secrets}${' '.repeat(10)}║\n`;
  html += `  ╠═════════════════════════════════════════════════╣\n`;
  html += `  ║  ${'MOOD'.padEnd(6)}${m}${' '.repeat(20)}║\n`;
  html += `  ╠═════════════════════════════════════════════════╣\n`;
  html += `  ║  ${'YOUR RESONANCE:'.padEnd(22)}║\n`;
  
  // Action counts
  const totalActions = Object.values(a).reduce((s, v) => s + v, 0);
  html += `  ║  ${'Combat:'.padEnd(8)}${a.combat}${' '.repeat(5)}- Total: ${totalActions}${' '.repeat(10)}║\n`;
  html += `  ║  ${'Explore:'.padEnd(8)}${a.explore}${' '.repeat(5)}-${' '.repeat(5)}║\n`;
  html += `  ║  ${'Silence:'.padEnd(8)}${a.silence}${' '.repeat(5)}-${' '.repeat(5)}║\n`;
  html += `  ║  ${'Build:'.padEnd(8)}${a.build}${' '.repeat(5)}-${' '.repeat(5)}║\n`;
  html += `  ║  ${'Curiosity:'.padEnd(8)}${a.curiosity}${' '.repeat(5)}-${' '.repeat(5)}║\n`;
  html += `  ╚═════════════════════════════════════════════════╝\n\n`;
  
  // World description
  html += `  ${'The world responds to what you do.'.padStart(40)}\n`;
  
  // Mood description
  const moodDescs = {
    light: 'The world feels expansive. Pathways open. Creatures are curious.',
    neutral: 'The world is balanced. Neither drawn to nor repelled by you.',
    heavy: 'The world feels watchful. Fewer paths. Creatures are defensive.'
  };
  html += `  ${moodDescs[m] || ''}\n\n`;
  
  // Recent activity
  html += `  ${'Recent activity:'.padEnd(24)}\n`;
  const recent = [];
  if (a.combat >= 3) recent.push('Combat patterns detected — world grows more combative');
  if (a.explore >= 3) recent.push('Exploration depth increases — more layered secrets');
  if (a.silence >= 3) recent.push('Silence embraced — world grows quiet, unknown becomes dangerous');
  if (a.build >= 3) recent.push('Building invested in — world reinforces structures');
  if (a.curiosity >= 3) recent.push('Curiosity rewarded — new avenues of inquiry appear');
  
  recent.forEach((r, i) => {
    html += `    ${i + 1}. ${r}\n`;
  });
  
  if (recent.length === 0) {
    html += `    ${'No clear patterns yet'.padEnd(38)}\n`;
  }
  
  html += `\n  ${'What will you do?'.padEnd(40)}\n`;
  html += `  ${'n: combat  e: explore  s: silence  b: build  c: curiosity'.padEnd(40)}\n`;
  
  el.innerHTML = html;
  el.scrollTop = el.scrollHeight;
}

// Render mood display
function renderMode() {
  const el = document.getElementById('mode');
  const moods = {
    light: 'LIGHT — world feels expansive and generous',
    neutral: 'NEUTRAL — world is balanced and responsive',
    heavy: 'HEAVY — world feels watchful and cautious'
  };
  el.textContent = moods[state.mood] || state.mood;
}

// Render controls
function renderControls() {
  const el = document.getElementById('controls');
  const mode = state.mood;
  let html = '';
  
  // Action buttons based on mood
  const enable = mode === 'light' ? 1 : mode === 'heavy' ? 0.5 : 1;
  
  html += `<button class="btn" onclick="action('combat')">${ACTION_LABELS.combat}</button>`;
  html += `<button class="btn" onclick="action('explore')">${ACTION_LABELS.explore}</button>`;
  html += `<button class="btn" onclick="action('silence')">${ACTION_LABELS.silence}</button>`;
  html += `<button class="btn" onclick="action('build')">${ACTION_LABELS.build}</button>`;
  html += `<button class="btn" onclick="action('curiosity')">${ACTION_LABELS.curiosity}</button>`;
  
  if (state.promptsRemaining > 0) {
    html += `<button class="btn" onclick="triggerPrompt()">💭 Co-Pilot Question</button>`;
  }
  
  html += `<span style="color:#666;font-size:10px">Turns: ${state.turns}</span>`;
  el.innerHTML = html;
}

// Process an action
function action(type) {
  // Track action
  state.actionCounts[type] = (state.actionCounts[type] || 0) + 1;
  state.turns++;
  
  // Check for pattern trigger (3 repetitions)
  const triggered = [];
  for (const [act, count] of Object.entries(state.actionCounts)) {
    if (count >= 3 && act !== type) {
      triggered.push(act);
    }
  }
  
  // Update world based on action
  const w = state.world;
  const a = state.actionCounts;
  
  if (type === 'combat') {
    w.creatures = Math.max(1, w.creatures + 1);
    if (a.combat >= 3) {
      w.pathways = Math.max(3, w.pathways - 1);
      addLog('Combat patterns detected — world grows more combative');
    }
  } else if (type === 'explore') {
    w.secrets = Math.min(10, w.secrets + 1);
    if (a.explore >= 3) {
      w.pathways = Math.min(12, w.pathways + 2);
      addLog('Exploration depth increases — more layered secrets');
    }
  } else if (type === 'silence') {
    // World grows quiet
    if (a.silence >= 3) {
      addLog('Silence embraced — world grows quiet, unknown becomes dangerous');
      // Reduce revealed information
    }
  } else if (type === 'build') {
    w.pathways = Math.min(12, w.pathways + 1);
    if (a.build >= 3) {
      addLog('Building invested in — world reinforces structures');
    }
  } else if (type === 'curiosity') {
    w.secrets = Math.min(10, w.secrets + 2);
    if (a.curiosity >= 3) {
      addLog('Curiosity rewarded — new avenues of inquiry appear');
    }
  }
  
  // Update mood
  updateMood();
  
  // Check for prompt triggers
  if (state.promptsRemaining > 0 && state.turns > 0 && state.turns % 5 === 0) {
    // Occasional prompts
  }
  
  renderViewport();
  renderControls();
  renderMode();
}

// Update mood based on action balance
function updateMood() {
  const a = state.actionCounts;
  const total = Object.values(a).reduce((s, v) => s + v, 0) || 1;
  
  // Determine mood based on dominant action
  let maxKey = 'explore';
  let maxVal = a.explore || 0;
  for (const [k, v] of Object.entries(a)) {
    if (v > maxVal) {
      maxVal = v;
      maxKey = k;
    }
  }
  
  // Light: curiosity + build dominant
  // Heavy: combat + silence dominant
  // Neutral: explore + trade dominant
  if (maxKey === 'curiosity' || maxKey === 'build') {
    state.mood = 'light';
    state.moodShift = 1;
  } else if (maxKey === 'combat' || maxKey === 'silence') {
    state.mood = 'heavy';
    state.moodShift = -1;
  } else {
    state.mood = 'neutral';
    state.moodShift = 0;
  }
}

// Add to log (shown in viewport)
function addLog(msg) {
  // Just render it next time
  renderViewport();
}

// Trigger one of three co-pilot prompts
function triggerPrompt() {
  if (state.promptsRemaining <= 0) return;
  
  const prompts = [
    'Why are you here, in this world?',
    'What do you protect, even at risk to yourself?',
    'What are you willing to lose, to gain what you seek?'
  ];
  
  const prompt = prompts[state.promptsRemaining - 1];
  const answer = prompt.toLowerCase(); // In a real version, this would be a real input
  
  // Process the answer and reshape world
  processPromptAnswer(prompt, answer);
  
  state.promptsRemaining--;
  state.promptHistory.push({prompt, answer});
  renderViewport();
}

// Process prompt answer and reshape world
function processPromptAnswer(prompt, answer) {
  const a = state.actionCounts;
  const w = state.world;
  
  if (!answer || answer.trim() === '') {
    // Default response - world shifts slightly
    if (prompt.includes('Why are you here')) {
      // Slight shift toward curiosity
      a.curiosity = (a.curiosity || 0) + 1;
    } else if (prompt.includes('What do you protect')) {
      // Slight shift toward build
      a.build = (a.build || 0) + 1;
    } else {
      // Slight shift toward explore
      a.explore = (a.explore || 0) + 1;
    }
  } else {
    // Real answer reshapes world
    const lower = answer.toLowerCase();
    
    if (prompt.includes('Why are you here')) {
      if (lower.includes('explore') || lower.includes('see')) {
        a.explore = (a.explore || 0) + 2;
        w.pathways = Math.min(12, w.pathways + 1);
      } else if (lower.includes('fight') || lower.includes('combat')) {
        a.combat = (a.combat || 0) + 2;
        w.creatures = Math.max(1, w.creatures + 1);
      } else if (lower.includes('build') || lower.create) {
        a.build = (a.build || 0) + 2;
        w.pathways = Math.min(12, w.pathways + 1);
      }
    }
    
    if (prompt.includes('What do you protect')) {
      if (lower.includes('people') || lower.lives || lower.creatures) {
        a.combat = (a.combat || 0) + 1; // Willingness to fight for others
        addLog('You said you protect others — world becomes more defensive but also more supportive');
      } else if (lower.includes('knowledge') || lower.secrets || lower.truth) {
        a.curiosity = (a.curiosity || 0) + 1;
        w.secrets = Math.min(10, w.secrets + 1);
        addLog('You said you protect knowledge — world reveals more secrets');
      } else {
        // General protection
        addLog('You said you protect something — world becomes more balanced');
      }
    }
    
    if (prompt.includes('What are you willing to lose')) {
      if (lower.includes('safety') || lower.comfort) {
        // Willingness to take risks
        a.combat = (a.combat || 0) + 1;
        a.curiosity = (a.curiosity || 0) + 1;
        addLog('You\'re willing to risk safety for answers — world becomes more unpredictable');
      } else if (lower.includes('secrets') || lower.knowledge) {
        // Willingness to lose secrets for something else
        w.secrets = Math.max(0, w.secrets - 1);
        a.build = (a.build || 0) + 1;
        addLog('You\'re willing to lose secrets — world reinforces structures instead');
      }
    }
  }
  
  state.promptsRemaining--;
}

// Initialize on load
initWorld();
renderViewport();
</script>
</body>
</html>
