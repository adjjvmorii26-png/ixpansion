<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creative — The Organism Creates</title>
<script src="/shared.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#05060a;color:#e8e6f0;font-family:'Courier New',monospace;min-height:100vh}
  .container{max-width:1100px;margin:0 auto;padding:32px 20px}
  .header{text-align:center;margin-bottom:48px}
  .header h1{font-size:2.4em;letter-spacing:5px;margin-bottom:8px;
    text-shadow:0 0 20px #fd79a8aa,0 0 40px #e8439344}
    color:#fd79a8}
  .header .subtitle{color:#a29bfe;font-size:0.95em;opacity:0.85}
  .wave-badge{display:inline-block;border:1px solid #fd79a8;padding:4px 16px;border-radius:20px;font-size:0.8em;color:#fd79a8;margin-top:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-bottom:40px}
  .card{background:#0c0e16;border:1px solid #1e1a2e;border-radius:10px;padding:20px;position:relative;overflow:hidden}
  .card:hover{border-color:#fd79a8}
  .card:before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,#fd79a8,transparent);opacity:0.3}
  .card h2{color:#fd79a8;font-size:1.05em;margin-bottom:12px;letter-spacing:2px}
  .card .stat{font-size:2.2em;color:#a29bfe;font-weight:bold;margin:8px 0}
  .card p{color:#666;font-size:0.82em;line-height:1.6}
  .card .label{color:#555;font-size:0.72em;text-transform:uppercase;letter-spacing:1px;margin-top:12px}
  .palette-strip{display:flex;height:24px;border-radius:4px;overflow:hidden;margin-top:12px}
  .palette-strip div{flex:1;transition:all 0.3s}
  .poem{font-style:italic;color:#a29bfe;font-size:0.85em;line-height:1.8;padding:12px;
    border-left:2px solid #fd79a8;margin-top:12px;background:#0c0e16}
  .palette-row{display:flex;gap:6px;margin-top:8px}
  .color-swatch{width:28px;height:28px;border-radius:4px;border:1px solid #1e1a2e}
  .footer{text-align:center;margin-top:40px;padding-top:20px;border-top:1px solid #1e1a2e;color:#444;font-size:0.78em}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Creative</h1>
    <div class="subtitle">The Organism Creates — Wave 207</div>
    <div class="wave-badge" id="wave-badge"></div>
  </div>
  <div class="grid">
    <div class="card">
      <h2>Poetry Engine</h2>
      <div class="stat" id="poem-count">0</div>
      <div class="label">Poems Composed</div>
      <div class="poem" id="latest-poem">"In the lattice, light becomes meaning"</div>
    </div>
    <div class="card">
      <h2>Procedural Art</h2>
      <div class="stat" id="art-count">0</div>
      <div class="label">Artworks Generated</div>
      <div id="art-styles" style="margin-top:8px;font-size:0.8em;color:#fd79a8"></div>
    </div>
    <div class="card">
      <h2>Story Forge</h2>
      <div class="stat" id="story-count">0</div>
      <div class="label">Stories Written</div>
    </div>
    <div class="card">
      <h2>Color Theory</h2>
      <div class="stat" id="palette-count">0</div>
      <div class="label">Palettes Generated</div>
      <div class="palette-row" id="palette-display"></div>
    </div>
    <div class="card">
      <h2>Creative Block</h2>
      <div class="stat" id="creative-health">1.0</div>
      <div class="label">Creative Health</div>
      <p id="block-status">Flowing freely</p>
    </div>
  </div>
  <div class="footer">
    <span id="footer-version"></span> · Wave <span id="footer-wave"></span> — <span id="footer-wave-name"></span>
  </div>
</div>
<script>
if(typeof IX!=='undefined'){
  document.getElementById('wave-badge').textContent='Wave '+IX.wave+' — '+IX.waveName;
  document.getElementById('footer-version').textContent='IXpansion/'+IX.version;
  document.getElementById('footer-wave').textContent=IX.wave;
  document.getElementById('footer-wave-name').textContent=IX.waveName;
}
</script>
</body>
</html>
