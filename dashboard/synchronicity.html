<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IXpansion — Synchronicity Field</title><style>body{font-family:system-ui,sans-serif;margin:0;padding:32px;max-width:1000px;margin-inline:auto;background:#0b0b10;color:#eee}h1{letter-spacing:.04em}.sub{opacity:.7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:24px 0}.card{border:1px solid #333;border-radius:14px;padding:18px;background:#12121a}.value{font-size:2rem;margin-top:8px}button{padding:10px 14px;border-radius:10px;border:1px solid #555;background:#1c1c28;color:#fff;cursor:pointer}textarea{width:100%;min-height:180px;background:#09090d;color:#eee;border:1px solid #333;border-radius:12px;padding:12px;box-sizing:border-box}pre{white-space:pre-wrap}</style></head><body><h1>✦ Synchronicity Field</h1><p class="sub">Wave 900 · experimental coincidence detector. Similarity is not causation.</p><div class="grid"><div class="card">PHASE<div id="phase" class="value">—</div></div><div class="card">FIELD ENERGY<div id="energy" class="value">—</div></div><div class="card">COLLISIONS<div id="count" class="value">—</div></div></div><textarea id="events">[{"id":"a","title":"dream garden","text":"new patterns emerge from dormant modules","realm":"dream"},{"id":"b","title":"garden resonance","text":"patterns emerge through living connections","realm":"garden"},{"id":"c","title":"quiet archive","text":"retired modules preserve old patterns","realm":"memory"}]</textarea><p><button onclick="run()">Refract events →</button></p><div class="card"><pre id="out">Press the button to generate a deterministic field.</pre></div><script>async function run(){const events=JSON.parse(document.getElementById('events').value);const r=await fetch('/api/wave900_synchronicity_engine',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'field',events})});const d=await r.json();document.getElementById('phase').textContent=d.phase||'error';document.getElementById('energy').textContent=d.energy??'—';document.getElementById('count').textContent=d.collisions?.length??0;document.getElementById('out').textContent=JSON.stringify(d.collisions||d,null,2)}</script></body></html>
