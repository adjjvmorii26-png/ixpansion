<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paradox Kintsugi — IXpansion Wave 461</title>
<script src="/shared.js"></script>
<script>window.si=window.si||function(){(window.siq=window.siq||[]).push(arguments);};</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
<style>
:root{--gold:#fff3a0;--ember:#ffcf66;--violet:#c8a8ff;--black:#0b0b0d;--obsidian:#16111f;--muted:#5f5f78;--kinship:#8fd3ff;--spring:#00e5a0;--pink:#ff5fa2}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'SF Mono',Fira Code,monospace;background:var(--black);color:#fdfdfd;min-height:100vh;background-image:radial-gradient(ellipse at 20% 70%,#ff5fa20a,transparent 50%),radial-gradient(ellipse at 80% 30%,#fff3a006,transparent 50%)}
.header{padding:26px 30px;border-bottom:1px solid #ffffff0a;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.header h1{font-size:1.5rem;letter-spacing:2px;background:linear-gradient(135deg,var(--gold),var(--violet),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-transform:uppercase;font-weight:800}
.subtitle{color:var(--muted);font-size:.72rem;letter-spacing:4px;text-transform:uppercase}
.badge{padding:3px 10px;border-radius:14px;font-size:.68rem;background:var(--obsidian);border:1px solid var(--violet);color:var(--violet)}
.container{max-width:1000px;margin:0 auto;padding:28px 20px}
.paradox{font-size:1.05rem;line-height:1.9;padding:28px;border:1px solid var(--pink)25;border-radius:14px;margin-bottom:24px;background:linear-gradient(135deg,var(--obsidian),#0a0a12)}
.paradox .q{font-style:italic}
.paradox .tension{display:inline-block;margin-top:12px;padding:4px 12px;border-radius:12px;background:var(--pink)18;color:var(--pink);font-size:.75rem}
.healed{font-size:1rem;line-height:1.8;padding:28px;border:1px solid var(--gold)30;border-radius:14px;margin-bottom:24px;background:linear-gradient(135deg,#16111f,#241a10)}
.healed .name{color:var(--gold);font-size:1.3rem;margin-bottom:10px}
.healed .art{color:var(--spring);font-style:italic}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.card{padding:22px;border-radius:14px;background:var(--obsidian);border:1px solid #ffffff0a}
.card h2{color:var(--violet);font-size:.9rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px}
.item{font-size:.8rem;color:#bbb;line-height:1.7;border-bottom:1px solid #ffffff08;padding:8px 0}
.item .gold{color:var(--gold)}
.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{padding:9px 16px;border-radius:10px;background:var(--pink)14;border:1px solid var(--pink);color:var(--pink);font-size:.75rem;cursor:pointer;letter-spacing:1px}
.btn.alt{border-color:var(--gold);color:var(--gold);background:var(--gold)10}
.btn:hover{transform:translateY(-1px);filter:brightness(1.2)}
.endpoint{color:var(--kinship);font-size:.72rem;margin-top:16px;display:inline-block}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header">
  <h1>Paradox Kintsugi</h1>
  <div class="subtitle">the organism heals its own contradictions with art</div>
  <span class="badge" id="identity-badge">Wave 461</span>
</div>
<div class="container">
  <div class="paradox" id="paradox">
    <div class="q">The organism is searching for its paradox…</div>
  </div>
  <div class="healed" id="healed" style="display:none">
    <div class="name" id="healed-name"></div>
    <div class="art" id="healed-art"></div>
  </div>

  <div class="actions">
    <button class="btn" data-action="detect">⚡ Detect Paradox</button>
    <button class="btn alt" data-action="heal">💛 Heal with Art</button>
    <button class="btn" data-action="refresh">Refresh</button>
  </div>

  <div class="grid" style="margin-top:22px">
    <div class="card">
      <h2>Open Paradoxes</h2>
      <div id="open-list"></div>
    </div>
    <div class="card">
      <h2>Healed Artifacts</h2>
      <div id="artifact-list"></div>
    </div>
  </div>
  <a class="endpoint" href="/api/paradox_kintsugi">/api/paradox_kintsugi</a>
</div>
<script>
const EP = "/kintsugi";
function el(id){return document.getElementById(id);}
async function post(action, extra){
  const r = await fetch(EP, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({action}, extra||{}))});
  return r.json();
}
function showParadox(p){
  el("paradox").innerHTML = `<div class="q">${p.question||"?"}</div><span class="tension">tension ${p.tension||"?"}</span>`;
}
function showHealed(a){
  el("healed").style.display = "block";
  el("healed-name").textContent = "🗿 " + (a.name||"?");
  el("healed-art").textContent = (a.art||"") + " — healing " + (a.healing||"?");
}
async function loadLists(){
  const o = await post("open");
  const al = await post("artifacts");
  const ol = el("open-list"); ol.innerHTML="";
  (o.open||[]).slice().reverse().forEach(p=>{ ol.insertAdjacentHTML("beforeend", `<div class="item">⚡ ${p.question} <span style="color:var(--muted)">t ${p.tension}</span></div>`); });
  if(!(o.open||[]).length) ol.innerHTML = '<div class="item">Nothing open — the organism is at peace.</div>';
  const al2 = el("artifact-list"); al2.innerHTML="";
  (al.artifacts||[]).slice().reverse().forEach(a=>{ al2.insertAdjacentHTML("beforeend", `<div class="item"><span class="gold">${a.name}</span> — healed ${a.healing}</div>`); });
  if(!(al.artifacts||[]).length) al2.innerHTML = '<div class="item">No artifacts yet.</div>';
}
document.querySelectorAll(".btn[data-action]").forEach(b=>{
  b.addEventListener("click", async ()=>{
    const a = b.dataset.action;
    if(a==="detect"){ showParadox(await post("detect")); }
    else if(a==="heal"){ showHealed(await post("heal")); }
    loadLists();
  });
});
if(window.IXP && window.IXP.renderIdentity) window.IXP.renderIdentity(el("identity-badge"));
(async ()=>{ showParadox(await post("detect")); loadLists(); })();
</script>
</body>
</html>
