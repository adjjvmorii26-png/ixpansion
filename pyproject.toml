[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ixpansion"
version = "4.13.0"
description = "The Computational Frontier — 370+ API modules, 157 experiments, 999+ tests, self-excavating archaeology organism"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ixpansion = "main:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "omega_prime/tests",
    "omega_fractal_engine/tests",
    "project_root/tests",
    "bridges",
    "mycelium/tests",
    "ixpansion/tests",
    "solid-organism/tests",
    "projects/tests",
    "nexus_observatory/tests",
    "lab/tests",
    "constellation/tests",
]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["constellation*", "omega_prime*", "mycelium*", "ixpansion*"]
