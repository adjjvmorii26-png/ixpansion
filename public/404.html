<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — the organism does not know this path</title>
<style>
  :root{--bg:#040410;--s:rgba(8,8,20,0.96);--b:rgba(255,255,255,0.07);--t:#9898b0;--m:#3e3e58;--vi:#a78bfa;--te:#2dd4bf;--gn:#4ade80}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--t);font-family:'SF Mono','Fira Code',monospace;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .center{text-align:center;max-width:600px;padding:40px}
  .code{font-size:6em;font-weight:800;background:linear-gradient(135deg,#fff,var(--vi),var(--te));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:8px}
  h2{color:#fff;font-size:1.2em;margin:16px 0 8px;letter-spacing:2px}
  p{color:var(--m);font-size:.85em;line-height:1.7}
  a{color:var(--vi);text-decoration:none}
  a:hover{text-decoration:underline}
  .links{margin-top:24px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .links a{padding:8px 16px;border:1px solid var(--b);border-radius:8px;font-size:.78em;color:var(--te)}
  .links a:hover{border-color:var(--vi);background:rgba(124,124,248,.08)}
  @keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .code{animation:drift 4s ease-in-out infinite}
</style>
</head>
<body>
<div class="center">
  <div class="code">404</div>
  <h2>This path does not exist in the organism.</h2>
  <p>But the organism is alive and always growing. Perhaps this path will exist in a future wave — or perhaps you were looking for something that already exists somewhere else.</p>
  <div class="links">
    <a href="/">Portal</a>
    <a href="/census">Census</a>
    <a href="/room">Confluence</a>
    <a href="/pulse">Pulse</a>
    <a href="/docs">Docs</a>
  </div>
</div>
</body>
</html>
